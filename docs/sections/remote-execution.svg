<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t-chapter-remote-execution d-chapter-remote-execution">
  <title id="t-chapter-remote-execution">remote hosts &amp; workers</title>
  <desc id="d-chapter-remote-execution">Connect another device, add independent workers and review their results.</desc>
  <defs>
