  <text x="40" y="113" font-size="64" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">start your workspace</text>
  <text x="40" y="169" font-size="15" fill="#8b949e">Full desktop distribution, terminal installation or a headless server archive.</text>
