  </defs>
  <g clip-path="url(#frame-chapter-get-started)" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect width="1200" height="200" fill="url(#bg-chapter-get-started)"/>
    <rect width="1200" height="200" fill="url(#grid-chapter-get-started)"/>
    <ellipse cx="160" cy="80" rx="420" ry="260" fill="url(#glow-chapter-get-started)"/>
    <ellipse cx="1120" cy="200" rx="380" ry="220" fill="url(#glow-chapter-get-started)" opacity="0.4"/>
    <rect x="0" y="0" width="6" height="200" fill="#7ee787"/>
