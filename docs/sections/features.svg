<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t-chapter-features d-chapter-features">
  <title id="t-chapter-features">inside a session</title>
  <desc id="d-chapter-features">Project secrets, reasoning, goals, Design review and session controls.</desc>
  <defs>
    <linearGradient id="bg-chapter-features" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
