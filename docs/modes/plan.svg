<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-plan d-plan">
  <title id="t-plan">plan mode</title>
  <desc id="d-plan">Plan mode: a read-only agent that writes a plan file and offers to switch to build when it is ready.</desc>
  <defs>
    <linearGradient id="bg-plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-plan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-plan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-plan" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-plan">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-plan)">
    <rect width="1200" height="230" fill="url(#bg-plan)"/>
    <rect width="1200" height="230" fill="url(#grid-plan)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-plan)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-plan)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#58a6ff"/>

    <!-- glyph -->
    <g transform="translate(70 45)" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="0" width="120" height="140" rx="14" stroke-opacity="0.55"/>
      <path d="M32 40 L42 50 L60 30"/>
      <line x1="74" y1="40" x2="110" y2="40" stroke-opacity="0.6"/>
      <path d="M32 74 L42 84 L60 64"/>
      <line x1="74" y1="74" x2="110" y2="74" stroke-opacity="0.6"/>
      <circle cx="40" cy="108" r="8" stroke-opacity="0.7"/>
      <line x1="74" y1="108" x2="98" y2="108" stroke-opacity="0.35"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">MODE 02 / 03</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2">
        <tspan fill="#f0f6fc">plan</tspan>
      </text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-plan)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">Read everything, change nothing but the plan. Hand it to build when it is settled.</text>
      <g>
      <rect x="262" y="176" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#58a6ff" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">read-only</text>
      <rect x="367.4" y="176" width="147" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#58a6ff" stroke-opacity="0.45"/>
      <text x="376.4" y="194" font-size="13" fill="#c9d1d9">.redcode/plans/</text>
      <rect x="524.4" y="176" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#58a6ff" stroke-opacity="0.45"/>
      <text x="533.4" y="194" font-size="13" fill="#c9d1d9">plan_exit</text>
      </g>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#58a6ff" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">02</text>
    </g>
  </g>
</svg>
