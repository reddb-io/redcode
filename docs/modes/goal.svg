<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-goal d-goal">
  <title id="t-goal">/goal mode</title>
  <desc id="d-goal">Goal: a definition of done kept in session metadata, judged at the end of every turn, pursued until it holds or the budget runs out.</desc>
  <defs>
    <linearGradient id="bg-goal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-goal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-goal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-goal" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-goal">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-goal)">
    <rect width="1200" height="230" fill="url(#bg-goal)"/>
    <rect width="1200" height="230" fill="url(#grid-goal)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-goal)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-goal)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#bc8cff"/>

    <!-- glyph -->
    <g transform="translate(70 45)" fill="none" stroke="#bc8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="70" cy="70" r="64" stroke-opacity="0.4"/>
      <circle cx="70" cy="70" r="42" stroke-opacity="0.65"/>
      <circle cx="70" cy="70" r="20"/>
      <circle cx="70" cy="70" r="5" fill="#bc8cff" stroke="none"/>
      <path d="M70 70 L124 16" stroke-width="3.5"/>
      <path d="M124 16 L110 18 M124 16 L122 30"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">ACROSS EVERY MODE</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2">
        <tspan fill="#f0f6fc">/goal</tspan>
      </text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-goal)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">A definition of done the harness pursues across turns until it holds.</text>
      <g>
      <rect x="262" y="176" width="61" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#bc8cff" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">/goal</text>
      <rect x="333.0" y="176" width="113" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#bc8cff" stroke-opacity="0.45"/>
      <text x="342.0" y="194" font-size="13" fill="#c9d1d9">/goal-pause</text>
      <rect x="455.6" y="176" width="121" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#bc8cff" stroke-opacity="0.45"/>
      <text x="464.6" y="194" font-size="13" fill="#c9d1d9">/goal-resume</text>
      <rect x="586.8" y="176" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#bc8cff" stroke-opacity="0.45"/>
      <text x="595.8" y="194" font-size="13" fill="#c9d1d9">/goal-drop</text>
      <rect x="700.8" y="176" width="130" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#bc8cff" stroke-opacity="0.45"/>
      <text x="709.8" y="194" font-size="13" fill="#c9d1d9">goal_complete</text>
      </g>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#bc8cff" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">◎</text>
    </g>
  </g>
</svg>
