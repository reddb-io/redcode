<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-design d-design">
  <title id="t-design">design mode</title>
  <desc id="d-design">Design mode: the agent builds an interactive prototype, you review it in your browser, and what you decide becomes a plan.</desc>
  <defs>
    <linearGradient id="bg-design" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-design" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-design" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-design" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-design">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-design)">
    <rect width="1200" height="230" fill="url(#bg-design)"/>
    <rect width="1200" height="230" fill="url(#grid-design)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-design)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-design)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#f4c95d"/>

    <!-- glyph -->
    <g transform="translate(70 45)" fill="none" stroke="#f4c95d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="6" width="140" height="122" rx="14" stroke-opacity="0.55"/>
      <line x1="0" y1="34" x2="140" y2="34" stroke-opacity="0.35"/>
      <circle cx="16" cy="20" r="3.5" fill="#f4c95d" stroke="none"/>
      <circle cx="30" cy="20" r="3.5" fill="#ffffff" fill-opacity="0.25" stroke="none"/>
      <rect x="18" y="50" width="54" height="34" rx="6" stroke-opacity="0.5"/>
      <rect x="18" y="96" width="104" height="14" rx="4" stroke-opacity="0.3"/>
      <rect x="82" y="50" width="40" height="34" rx="6" stroke="#f4c95d" stroke-dasharray="5 4"/>
      <path d="M100 82 L100 100 L106 94 L114 108 L120 105 L112 91 L120 90 Z" fill="#f4c95d" stroke="#0d1117" stroke-width="2"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">MODE 03 / 03</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2">
        <tspan fill="#f0f6fc">design</tspan>
      </text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-design)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">Work out what something should be by building it, and reviewing it in the browser.</text>
      <g>
      <rect x="262" y="176" width="224" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">prototype in the browser</text>
      <rect x="496.4" y="176" width="259" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.45"/>
      <text x="505.4" y="194" font-size="13" fill="#c9d1d9">annotate, whiteboard, export</text>
      <rect x="765.1999999999999" y="176" width="113" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.45"/>
      <text x="774.1999999999999" y="194" font-size="13" fill="#c9d1d9">design_exit</text>
      </g>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#f4c95d" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">03</text>
    </g>
  </g>
</svg>
