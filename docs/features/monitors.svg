<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-monitors d-monitors">
  <title id="t-monitors">monitors</title>
  <desc id="d-monitors">Monitors: long-running background watches listed in one tab.</desc>
  <defs>
    <linearGradient id="bg-monitors" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-monitors" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-monitors" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-monitors" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-monitors">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-monitors)">
    <rect width="1200" height="230" fill="url(#bg-monitors)"/>
    <rect width="1200" height="230" fill="url(#grid-monitors)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-monitors)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-monitors)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#7ee787"/>

    <g transform="translate(70 45)" fill="none" stroke="#7ee787" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="10" width="140" height="96" rx="14" stroke-opacity="0.55"/>
      <path d="M14 70 L40 70 L52 40 L70 92 L84 56 L94 70 L126 70"/>
      <line x1="50" y1="126" x2="90" y2="126" stroke-opacity="0.5"/>
      <line x1="70" y1="106" x2="70" y2="126" stroke-opacity="0.5"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">BACKGROUND WATCHERS</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2" fill="#f0f6fc">monitors</text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-monitors)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">Background watches the agent starts, in one tab, waking the session when done.</text>
      <rect x="262" y="176" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#7ee787" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">/monitors</text>
      <rect x="367" y="176" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#7ee787" stroke-opacity="0.45"/>
      <text x="376" y="194" font-size="13" fill="#c9d1d9">started</text>
      <rect x="455" y="176" width="87" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#7ee787" stroke-opacity="0.45"/>
      <text x="464" y="194" font-size="13" fill="#c9d1d9">finished</text>
      <rect x="552" y="176" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#7ee787" stroke-opacity="0.45"/>
      <text x="561" y="194" font-size="13" fill="#c9d1d9">expired</text>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#7ee787" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">~</text>
    </g>
  </g>
</svg>
