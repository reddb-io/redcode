<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-worktrees d-worktrees">
  <title id="t-worktrees">worktrees</title>
  <desc id="d-worktrees">Worktrees and the background service.</desc>
  <defs>
    <linearGradient id="bg-worktrees" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-worktrees" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-worktrees" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-worktrees" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-worktrees">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-worktrees)">
    <rect width="1200" height="230" fill="url(#bg-worktrees)"/>
    <rect width="1200" height="230" fill="url(#grid-worktrees)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-worktrees)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-worktrees)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#a5b4fc"/>

    <g transform="translate(70 45)" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="30" cy="20" r="11"/>
      <circle cx="30" cy="120" r="11"/>
      <circle cx="110" cy="52" r="11"/>
      <line x1="30" y1="31" x2="30" y2="109"/>
      <path d="M30 86 C30 62 110 84 110 63" stroke-opacity="0.8"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">ISOLATION</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2" fill="#f0f6fc">worktrees</text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-worktrees)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">Isolated git worktrees per task, and a background server that outlives the TUI.</text>
      <rect x="262" y="176" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">/worktrees</text>
      <rect x="376" y="176" width="61" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <text x="385" y="194" font-size="13" fill="#c9d1d9">--tmp</text>
      <rect x="447" y="176" width="147" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <text x="456" y="194" font-size="13" fill="#c9d1d9">redcode service</text>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#a5b4fc" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">//</text>
    </g>
  </g>
</svg>
