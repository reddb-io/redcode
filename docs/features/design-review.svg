    <rect x="1008" y="57" width="116" height="24" rx="12" fill="#f4c95d" fill-opacity="0.16" stroke="#f4c95d" stroke-opacity="0.7"/>
      <text x="1020" y="73" font-size="11.5" fill="#c9d1d9">Annotate</text>

    <line x1="820" y1="88" x2="820" y2="470" stroke="#ffffff" stroke-opacity="0.08"/>

