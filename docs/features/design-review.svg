<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t-review d-review">
  <title id="t-review">The design review page</title>
  <desc id="d-review">A browser window showing a prototype with numbered annotation pins on the left and the conversation panel with queued notes and a Send to Agent button on the right.</desc>
  <defs>
    <linearGradient id="bg-review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-review" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-review" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <marker id="arrow-review" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f4c95d"/>
    </marker>
    <clipPath id="frame-review">
      <rect x="0" y="0" width="1200" height="520" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-review)" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect width="1200" height="520" fill="url(#bg-review)"/>
    <rect width="1200" height="520" fill="url(#grid-review)"/>
    <ellipse cx="160" cy="80" rx="420" ry="260" fill="url(#glow-review)"/>
    <ellipse cx="1120" cy="520" rx="380" ry="220" fill="url(#glow-review)" opacity="0.4"/>
    <rect x="0" y="0" width="6" height="520" fill="#f4c95d"/>
    <rect x="60" y="50" width="1080" height="420" rx="14" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="60" y="50" width="1080" height="38" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="84" cy="69" r="5" fill="#ff5f57"/><circle cx="102" cy="69" r="5" fill="#febc2e"/><circle cx="120" cy="69" r="5" fill="#28c840"/>
    <rect x="200" y="58" width="520" height="22" rx="11" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="216" y="73" font-size="11.5" fill="#8b949e">localhost:4096/design/2026-09-30-pricing-page</text>
    <rect x="890" y="57" width="110" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#f4c95d" stroke-opacity="0.25"/>
