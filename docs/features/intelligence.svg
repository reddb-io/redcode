<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t-intelligence d-intelligence">
  <title id="t-intelligence">S1 · S2</title>
  <desc id="d-intelligence">S1 and S2 reasoning roles: S2 generates and works, S1 evaluates with typed questions.</desc>
  <defs>
    <linearGradient id="bg-intelligence" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-intelligence" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39c5cf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule-intelligence" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39c5cf"/>
      <stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-intelligence" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-intelligence">
      <rect x="0" y="0" width="1200" height="230" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-intelligence)">
    <rect width="1200" height="230" fill="url(#bg-intelligence)"/>
    <rect width="1200" height="230" fill="url(#grid-intelligence)"/>
    <ellipse cx="130" cy="115" rx="360" ry="220" fill="url(#glow-intelligence)"/>
    <ellipse cx="1130" cy="230" rx="300" ry="170" fill="url(#glow-intelligence)" opacity="0.45"/>
    <rect x="0" y="0" width="6" height="230" fill="#39c5cf"/>

    <g transform="translate(70 45)" fill="none" stroke="#39c5cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="70" r="46" stroke-opacity="0.7"/>
      <circle cx="94" cy="70" r="46" stroke-opacity="0.4"/>
      <text x="26" y="78" font-size="22" font-weight="700" fill="#39c5cf" stroke="none" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">S1</text>
      <text x="92" y="78" font-size="22" font-weight="700" fill="#39c5cf" stroke="none" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">S2</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="262" y="60" font-size="11" fill="#6e7681" letter-spacing="2.5">DUAL REASONING</text>
      <text x="260" y="118" font-size="60" font-weight="700" letter-spacing="-2" fill="#f0f6fc">S1 · S2</text>
      <rect x="262" y="132" width="120" height="3" fill="url(#rule-intelligence)"/>
      <text x="262" y="160" font-size="18" fill="#8b949e">S2 does the work. S1 checks it with typed questions before you trust it.</text>
      <rect x="262" y="176" width="70" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#39c5cf" stroke-opacity="0.45"/>
      <text x="271" y="194" font-size="13" fill="#c9d1d9">/setup</text>
      <rect x="342" y="176" width="130" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#39c5cf" stroke-opacity="0.45"/>
      <text x="351" y="194" font-size="13" fill="#c9d1d9">/intelligence</text>
      <rect x="482" y="176" width="138" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#39c5cf" stroke-opacity="0.45"/>
      <text x="491" y="194" font-size="13" fill="#c9d1d9">TypeSafe / JEV</text>
      <rect x="630" y="176" width="138" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#39c5cf" stroke-opacity="0.45"/>
      <text x="639" y="194" font-size="13" fill="#c9d1d9">single or dual</text>
      <text x="1130" y="200" font-size="120" font-weight="700" fill="#39c5cf" fill-opacity="0.07" text-anchor="end" letter-spacing="-6">::</text>
    </g>
  </g>
</svg>
