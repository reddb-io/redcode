<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t-flow d-flow">
  <title id="t-flow">How design mode works</title>
  <desc id="d-flow">Design mode flow: describe, prototype, preview, review in the browser, send to the agent, revise until settled, then design_exit writes the plan and build implements it.</desc>
  <defs>
    <linearGradient id="bg-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-flow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-flow" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f4c95d"/>
    </marker>
    <clipPath id="frame-flow">
      <rect x="0" y="0" width="1200" height="500" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-flow)" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect width="1200" height="500" fill="url(#bg-flow)"/>
    <rect width="1200" height="500" fill="url(#grid-flow)"/>
    <ellipse cx="160" cy="80" rx="420" ry="260" fill="url(#glow-flow)"/>
    <ellipse cx="1120" cy="500" rx="380" ry="220" fill="url(#glow-flow)" opacity="0.4"/>
    <rect x="0" y="0" width="6" height="500" fill="#f4c95d"/>
    <text x="50" y="52" font-size="11" fill="#6e7681" letter-spacing="2.5">HOW DESIGN MODE WORKS</text>
    <text x="50" y="84" font-size="26" font-weight="700" fill="#f0f6fc">A prototype you can click, then a plan you can build</text>
    <g>
      <rect x="50" y="110" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="76" cy="138" r="12" fill="#f4c95d"/>
      <text x="76" y="143" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">1</text>
      <text x="98" y="143" font-size="17" font-weight="700" fill="#f0f6fc">Describe</text>
      <text x="70" y="168" font-size="12.5" fill="#8b949e">Tab to the design agent;</text>
      <text x="70" y="186" font-size="12.5" fill="#8b949e">pick web, app or slides</text>
    </g>
    <g>
      <rect x="340" y="110" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="366" cy="138" r="12" fill="#f4c95d"/>
      <text x="366" y="143" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">2</text>
      <text x="388" y="143" font-size="17" font-weight="700" fill="#f0f6fc">Prototype</text>
      <text x="360" y="168" font-size="12.5" fill="#8b949e">writes .redcode/designs/</text>
      <text x="360" y="186" font-size="12.5" fill="#8b949e">reads your DESIGN.md</text>
    </g>
    <g>
      <rect x="630" y="110" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="656" cy="138" r="12" fill="#f4c95d"/>
      <text x="656" y="143" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">3</text>
      <text x="678" y="143" font-size="17" font-weight="700" fill="#f0f6fc">design_preview</text>
      <text x="650" y="168" font-size="12.5" fill="#8b949e">your browser opens on</text>
      <text x="650" y="186" font-size="12.5" fill="#8b949e">the review page</text>
    </g>
    <g>
      <rect x="920" y="110" width="230" height="92" rx="14" fill="#f4c95d" fill-opacity="0.1" stroke="#f4c95d" stroke-opacity="0.75"/>
      <circle cx="946" cy="138" r="12" fill="#f4c95d"/>
      <text x="946" y="143" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">4</text>
      <text x="968" y="143" font-size="17" font-weight="700" fill="#f0f6fc">Review</text>
      <text x="940" y="168" font-size="12.5" fill="#8b949e">annotate, explore, draw,</text>
      <text x="940" y="186" font-size="12.5" fill="#8b949e">audit the layout</text>
    </g>
    <g>
      <rect x="920" y="300" width="230" height="92" rx="14" fill="#f4c95d" fill-opacity="0.1" stroke="#f4c95d" stroke-opacity="0.75"/>
      <circle cx="946" cy="328" r="12" fill="#f4c95d"/>
      <text x="946" y="333" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">5</text>
      <text x="968" y="333" font-size="17" font-weight="700" fill="#f0f6fc">Send to Agent</text>
      <text x="940" y="358" font-size="12.5" fill="#8b949e">queued notes become</text>
      <text x="940" y="376" font-size="12.5" fill="#8b949e">one agent turn</text>
    </g>
    <g>
      <rect x="630" y="300" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="656" cy="328" r="12" fill="#f4c95d"/>
      <text x="656" y="333" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">6</text>
      <text x="678" y="333" font-size="17" font-weight="700" fill="#f0f6fc">Revise</text>
      <text x="650" y="358" font-size="12.5" fill="#8b949e">the agent edits the</text>
      <text x="650" y="376" font-size="12.5" fill="#8b949e">prototype; page reloads</text>
    </g>
    <g>
      <rect x="340" y="300" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="366" cy="328" r="12" fill="#f4c95d"/>
      <text x="366" y="333" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">7</text>
      <text x="388" y="333" font-size="17" font-weight="700" fill="#f0f6fc">design_exit</text>
      <text x="360" y="358" font-size="12.5" fill="#8b949e">writes the plan from the</text>
      <text x="360" y="376" font-size="12.5" fill="#8b949e">decisions in design.json</text>
    </g>
    <g>
      <rect x="50" y="300" width="230" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#f4c95d" stroke-opacity="0.35"/>
      <circle cx="76" cy="328" r="12" fill="#f4c95d"/>
      <text x="76" y="333" font-size="14" font-weight="700" fill="#0d1117" text-anchor="middle">8</text>
      <text x="98" y="333" font-size="17" font-weight="700" fill="#f0f6fc">plan, then build</text>
      <text x="70" y="358" font-size="12.5" fill="#8b949e">plan agent refines it;</text>
      <text x="70" y="376" font-size="12.5" fill="#8b949e">build implements it</text>
    </g>
    <path d="M280 156 H336" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <path d="M570 156 H626" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <path d="M860 156 H916" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <path d="M1035 202 V296" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <text x="1047" y="252" font-size="12" fill="#f4c95d" text-anchor="start">Send</text>
    <path d="M916 346 H864" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <path d="M626 346 H574" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <text x="600" y="336" font-size="12" fill="#f4c95d" text-anchor="middle">settled</text>
    <path d="M340 346 H284" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-flow)"/>
    <path d="M745 296 V206" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="6 5" marker-end="url(#arrow-flow)"/>
    <text x="757" y="252" font-size="12" fill="#f4c95d" text-anchor="start">not yet: reload, review again</text>
    <rect x="50" y="430" width="1100" height="44" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="72" y="457" font-size="13.5" fill="#c9d1d9">Nothing reaches the agent until you press <tspan fill="#f4c95d" font-weight="700">Send to Agent</tspan>, and the agent can edit the prototype but never the product.</text>
  </g>
</svg>
