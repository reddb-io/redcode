<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="rc-hero-title rc-hero-desc">
  <title id="rc-hero-title">Redcode — terminal and desktop coding agent</title>
  <desc id="rc-hero-desc">An open-source coding agent built on OpenCode, with terminal and desktop clients, agent servers, remote worker batches, Console administration, Design review, project secrets and dual reasoning.</desc>
  <defs>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="rc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2056" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff2056" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rc-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2056"/>
      <stop offset="1" stop-color="#ff2056" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rc-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="rc-frame">
      <rect x="0" y="0" width="1200" height="420" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rc-frame)">
    <rect width="1200" height="420" fill="url(#rc-bg)"/>
    <rect width="1200" height="420" fill="url(#rc-grid)"/>
    <ellipse cx="120" cy="60" rx="420" ry="300" fill="url(#rc-glow)"/>
    <ellipse cx="1120" cy="410" rx="360" ry="240" fill="url(#rc-glow)" opacity="0.5"/>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <text x="72" y="150" font-size="88" font-weight="700" letter-spacing="-3"><tspan fill="#ff2056">red</tspan><tspan fill="#f0f6fc">code</tspan></text>
      <text x="72" y="204" font-size="34" font-weight="600" fill="#ff2056" letter-spacing="-1">terminal + desktop</text>
      <rect x="74" y="230" width="148" height="3" fill="url(#rc-rule)"/>
      <text x="72" y="272" font-size="19" fill="#8b949e">Open a project. Describe the work.</text>
      <text x="72" y="298" font-size="19" fill="#8b949e">Review the changes with your agent.</text>
      <text x="72" y="332" font-size="11" fill="#6e7681" letter-spacing="2.5">BUILT ON</text>
      <g font-size="14">
        <rect x="72" y="342" width="106" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ff2056" stroke-opacity="0.35"/>
        <text x="90" y="361" fill="#c9d1d9">OpenCode</text>
        <rect x="190" y="342" width="88" height="28" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="208" y="361" fill="#c9d1d9">Effect</text>
      </g>
      <text x="72" y="398" font-size="11" fill="#6e7681" letter-spacing="2">RUNS AS</text>
      <text x="150" y="398" font-size="14" fill="#8b949e">Desktop app · terminal app</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
      <rect x="720" y="40" width="424" height="340" rx="12" fill="#0b0f15" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="744" y="76" font-size="12" fill="#6e7681" letter-spacing="1">WHAT YOU CAN DO</text>
      <rect x="744" y="88" width="72" height="3" fill="url(#rc-rule)"/>
      <g>
        <circle cx="752" cy="128" r="4" fill="#ff2056"/>
        <text x="768" y="132" font-size="18" fill="#c9d1d9">Edit and run project code</text>
        <circle cx="752" cy="170" r="4" fill="#58a6ff"/>
        <text x="768" y="174" font-size="18" fill="#c9d1d9">Plan before implementation</text>
        <circle cx="752" cy="212" r="4" fill="#f4c95d"/>
        <text x="768" y="216" font-size="18" fill="#c9d1d9">Review interactive prototypes</text>
        <circle cx="752" cy="254" r="4" fill="#f78166"/>
        <text x="768" y="258" font-size="18" fill="#c9d1d9">Keep project secrets scoped</text>
        <circle cx="752" cy="296" r="4" fill="#bc8cff"/>
        <text x="768" y="300" font-size="18" fill="#c9d1d9">Continue toward a goal</text>
        <circle cx="752" cy="338" r="4" fill="#7ee787"/>
        <text x="768" y="342" font-size="18" fill="#c9d1d9">Delegate tasks to your workers</text>
      </g>
    </g>
  </g>
</svg>
