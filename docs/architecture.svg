<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t-architecture d-architecture">
  <title id="t-architecture">Redcode components and remote execution</title>
  <desc id="d-architecture">CLI, Desktop and browser clients connect to an agent server. Its coordinator dispatches tasks to independent worker servers and checkouts. A separate Console optionally authorizes delegated access.</desc>
  <defs>
    <linearGradient id="bg-architecture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glow-architecture" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-architecture" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <marker id="arrow-architecture" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f4c95d"/>
    </marker>
    <clipPath id="frame-architecture">
      <rect x="0" y="0" width="1200" height="580" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame-architecture)" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect width="1200" height="580" fill="url(#bg-architecture)"/>
    <rect width="1200" height="580" fill="url(#grid-architecture)"/>
    <ellipse cx="160" cy="80" rx="420" ry="260" fill="url(#glow-architecture)"/>
    <ellipse cx="1120" cy="580" rx="380" ry="220" fill="url(#glow-architecture)" opacity="0.4"/>
    <rect x="0" y="0" width="6" height="580" fill="#f4c95d"/>
    <text x="50" y="48" font-size="11" fill="#6e7681" letter-spacing="2.5">HOW REDCODE FITS TOGETHER</text>
    <text x="50" y="83" font-size="28" font-weight="700" fill="#f0f6fc">One engine. Clear roles. Your machines.</text>
    <g>
    <rect x="50" y="154" width="280" height="116" rx="14" fill="#ff2056" fill-opacity="0.06" stroke="#ff2056" stroke-opacity="0.55"/>
    <rect x="70" y="176" width="28" height="3" fill="#ff2056"/>
    <text x="70" y="205" font-size="18" font-weight="700" fill="#f0f6fc">CLI / Desktop / browser</text>
    <text x="70" y="230" font-size="13" fill="#8b949e">Your coding interface</text>
<text x="70" y="251" font-size="13" fill="#8b949e">Connect to the selected host</text>
  </g>
    <g>
    <rect x="440" y="154" width="320" height="116" rx="14" fill="#f4c95d" fill-opacity="0.06" stroke="#f4c95d" stroke-opacity="0.55"/>
    <rect x="460" y="176" width="28" height="3" fill="#f4c95d"/>
    <text x="460" y="205" font-size="18" font-weight="700" fill="#f0f6fc">Agent server / coordinator</text>
    <text x="460" y="230" font-size="13" fill="#8b949e">Sessions, tools and host files</text>
<text x="460" y="251" font-size="13" fill="#8b949e">Registry, batches and results</text>
  </g>
    <g>
    <rect x="870" y="125" width="280" height="116" rx="14" fill="#7ee787" fill-opacity="0.06" stroke="#7ee787" stroke-opacity="0.55"/>
    <rect x="890" y="147" width="28" height="3" fill="#7ee787"/>
    <text x="890" y="176" font-size="18" font-weight="700" fill="#f0f6fc">Worker agent server A</text>
    <text x="890" y="201" font-size="13" fill="#8b949e">Own database and provider</text>
<text x="890" y="222" font-size="13" fill="#8b949e">Independent checkout A</text>
  </g>
    <g>
    <rect x="870" y="313" width="280" height="116" rx="14" fill="#7ee787" fill-opacity="0.06" stroke="#7ee787" stroke-opacity="0.55"/>
    <rect x="890" y="335" width="28" height="3" fill="#7ee787"/>
    <text x="890" y="364" font-size="18" font-weight="700" fill="#f0f6fc">Worker agent server B</text>
    <text x="890" y="389" font-size="13" fill="#8b949e">Own database and provider</text>
<text x="890" y="410" font-size="13" fill="#8b949e">Independent checkout B</text>
  </g>
    <g>
    <rect x="440" y="365" width="320" height="116" rx="14" fill="#bc8cff" fill-opacity="0.06" stroke="#bc8cff" stroke-opacity="0.55"/>
    <rect x="460" y="387" width="28" height="3" fill="#bc8cff"/>
    <text x="460" y="416" font-size="18" font-weight="700" fill="#f0f6fc">Console</text>
    <text x="460" y="441" font-size="13" fill="#8b949e">Accounts, orgs and workspaces</text>
<text x="460" y="462" font-size="13" fill="#8b949e">Owners, OIDC and grants</text>
  </g>
    <path d="M330 212 H436" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-architecture)"/>
    <path d="M760 212 H815 V183 H866" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-architecture)"/>
    <path d="M815 212 V371 H866" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow-architecture)"/>
    <path d="M600 365 V274" fill="none" stroke="#f4c95d" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="6 5" marker-end="url(#arrow-architecture)"/>
    <text x="346" y="194" font-size="12" fill="#8b949e">connect</text>
    <text x="777" y="288" font-size="12" fill="#8b949e">tasks</text>
    <text x="617" y="317" font-size="12" fill="#bc8cff">optional</text>
    <text x="617" y="337" font-size="12" fill="#bc8cff">authorization</text>
    <text x="50" y="315" font-size="14" fill="#c9d1d9">Client ≠ execution host.</text>
    <text x="50" y="341" font-size="13" fill="#8b949e">Files and tools stay on</text>
    <text x="50" y="362" font-size="13" fill="#8b949e">the selected agent server.</text>
    <rect x="50" y="509" width="1100" height="42" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="72" y="535" font-size="13" fill="#c9d1d9">Each worker owns its sessions and checkout. No shared SQLite database, automatic repository sync or extra master binary.</text>
  </g>
</svg>
