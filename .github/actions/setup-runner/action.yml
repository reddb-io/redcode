name: Prepare the company Linux runner
description: Explicit Ubuntu toolchain and writable tool caches for disposable ARC jobs.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
        test "$(uname -m)" = x86_64
        test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
        mkdir -p "$RUNNER_TEMP/tool-cache"
        echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/tool-cache" >> "$GITHUB_ENV"
        echo "AGENT_TOOLSDIRECTORY=$RUNNER_TEMP/tool-cache" >> "$GITHUB_ENV"
        sudo apt-get -qq update
        sudo apt-get install -y --no-install-recommends python3 python3-pip python3-venv python3-setuptools build-essential pkg-config libssl-dev libsecret-1-dev jq gh unzip zip xz-utils zstd ripgrep
        sudo rm -rf /var/lib/apt/lists/*
