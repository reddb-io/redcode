name: Validate Redcode workflows
description: Check workflow syntax and reject upstream automation destinations
runs:
  using: composite
  steps:
    - name: Validate workflows
      shell: bash
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/redcode-actionlint"
        mkdir -p "$directory"
        curl --fail --location --retry 3 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$directory/actionlint.tar.gz"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $directory/actionlint.tar.gz" | sha256sum --check -
        tar -xzf "$directory/actionlint.tar.gz" -C "$directory" actionlint
        "$directory/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
        if grep -nE 'anomalyco/|sst/opencode|opencode\.ai/install|OPENCODE_APP_SECRET|OPENCODE_API_KEY' .github/workflows/*.yml; then
          echo '::error::Active Redcode workflows must not target or authenticate as upstream OpenCode.'
          exit 1
        fi
