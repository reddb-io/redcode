name: Setup Playwright
description: Install Chromium and system dependencies for unit and browser tests
runs:
  using: composite
  steps:
    # Setup Bun also selects Node, so apply this after it has installed dependencies.
    - name: Setup Node for Playwright
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
        node-version: "24.15"

    - name: Read Playwright version
      id: playwright-version
      shell: bash
      working-directory: packages/app
      run: |
        version=$(node -p 'require("@playwright/test/package.json").version')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

    # Browser archives do not contain Linux system libraries, even on a cache hit.
    - name: Install Playwright system dependencies
      if: runner.os == 'Linux'
      shell: bash
      working-directory: packages/app
      # A stalled download must fail the attempt so the retry runs instead of hanging the job. The
      # runner image already ships the libraries Chromium needs, so an apt mirror outage degrades to
      # a warning here; a browser that truly cannot launch still fails its own tests loudly.
      run: |
        for attempt in 1 2 3; do
          if timeout 300 bunx playwright install-deps chromium; then exit 0; fi
          echo "playwright install-deps failed (attempt $attempt)"
          # A killed attempt can leave apt-get holding the dpkg lock; clear it before retrying.
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sleep $((attempt * 15))
        done
        echo "::warning::playwright install-deps failed; relying on the runner image's preinstalled libraries"

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: packages/app
      run: |
        for attempt in 1 2 3; do
          if timeout 300 bunx playwright install chromium; then exit 0; fi
          echo "playwright install failed (attempt $attempt)"
          sleep $((attempt * 15))
        done
        bunx playwright install chromium
