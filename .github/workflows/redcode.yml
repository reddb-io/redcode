name: redcode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional expected version; must match the Changesets release plan"
        required: false
        type: string
      publish:
        description: "Publish verified archives and npm packages"
        required: true
        default: false
        type: boolean

concurrency:
  group: redcode-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: reddb-io/redcode
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - name: Validate release owner and branch
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'reddb-io/redcode'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [ -n "$EXPECTED_VERSION" ]; then
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: ./.github/actions/setup-bun
      - name: Prepare Changesets release on main
        id: prepare
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          bun run release:status --output /tmp/redcode-release-plan.json
          if [ "$(bun -p 'require("/tmp/redcode-release-plan.json").releases.length > 0')" = 'true' ]; then
            bun run release:version
          fi
          version=$(bun -p 'require("./packages/redcode/package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "::error::Changesets selected $version, but the requested version was $EXPECTED_VERSION."
            exit 1
          fi
          bun install --lockfile-only --ignore-scripts
          if [ "$PUBLISH" = 'true' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .changeset packages/redcode/package.json bun.lock
            if [ -f packages/redcode/CHANGELOG.md ]; then
              git add -- packages/redcode/CHANGELOG.md
            fi
            if ! git diff --cached --quiet; then
              HUSKY=0 git commit -m "chore(release): version Redcode $version"
              HUSKY=0 git push origin HEAD:main
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Redcode release plan"
            echo "Version: $version"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Publish: $PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/check-workflows
      - name: Validate version
        env:
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          [[ "$REDCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Lint and typecheck
        run: bun run check
      - name: Verify generated client
        working-directory: packages/client
        run: bun run check:generated

  tests:
    needs: plan
    name: Redcode contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - name: Install ripgrep for offline Core tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Test Redcode product contracts
        run: bun run script/test-redcode.ts

  sidecar:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, host: ubuntu-latest, target: x86_64-linux-gnu.2.29, file: redcode-rpc-sidecar-linux-x64 }
          - {
              name: linux-arm64,
              host: ubuntu-latest,
              target: aarch64-linux-gnu.2.29,
              file: redcode-rpc-sidecar-linux-arm64,
            }
          - {
              name: linux-x64-musl,
              host: ubuntu-latest,
              target: x86_64-linux-musl,
              file: redcode-rpc-sidecar-linux-x64-musl,
            }
          - {
              name: linux-arm64-musl,
              host: ubuntu-latest,
              target: aarch64-linux-musl,
              file: redcode-rpc-sidecar-linux-arm64-musl,
            }
          - {
              name: windows-x64,
              host: ubuntu-latest,
              target: x86_64-windows-gnu,
              file: redcode-rpc-sidecar-windows-x64.exe,
            }
          - {
              name: windows-arm64,
              host: ubuntu-latest,
              target: aarch64-windows-gnu,
              file: redcode-rpc-sidecar-windows-arm64.exe,
            }
          - { name: darwin-x64, host: macos-15-intel, target: "", file: redcode-rpc-sidecar-darwin-x64 }
          - { name: darwin-arm64, host: macos-15, target: "", file: redcode-rpc-sidecar-darwin-arm64 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter=@reddb-io/redcode-rpc-sidecar
      - name: Install pinned Zig cross compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file=zig-x86_64-linux-0.17.0-dev.1857+3c46da14d.tar.xz
          for base in https://ziglang.org/builds https://pkg.hexops.org/zig https://zig.squirl.dev https://zig.tilok.dev https://pkg.earth/zig https://zig.bcr.ist https://zig.chainsafe.dev; do
            if curl --fail --location --silent --show-error --retry 2 --output /tmp/redcode-zig.tar.xz "$base/$file" &&
              echo "0825e4a55baf4a6647c3ce3077a7236c9ffec5b17e1ca0102a930fe33d631bc6  /tmp/redcode-zig.tar.xz" | sha256sum --check -; then
              break
            fi
            rm -f /tmp/redcode-zig.tar.xz
          done
          test -f /tmp/redcode-zig.tar.xz
          tar -xf /tmp/redcode-zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.0-dev.1857+3c46da14d" >> "$GITHUB_PATH"
      - name: Build native sidecar
        working-directory: packages/rpc-sidecar
        env:
          REDCODE_RPC_SIDECAR_OUTPUT: dist/release/${{ matrix.file }}
          REDCODE_RPC_SIDECAR_TARGET: ${{ matrix.target }}
        run: bun run build
      - name: Exercise native sidecar
        if: matrix.name == 'linux-x64' || matrix.name == 'darwin-x64' || matrix.name == 'darwin-arm64'
        working-directory: packages/rpc-sidecar
        env:
          REDCODE_RPC_SIDECAR_COMMAND: ${{ github.workspace }}/packages/rpc-sidecar/dist/release/${{ matrix.file }}
        run: bun test test/sidecar.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpc-sidecar-${{ matrix.name }}
          path: packages/rpc-sidecar/dist/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  design:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REDCODE_DESIGN_APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - name: Build Design app and release archives
        working-directory: packages/design-app
        run: bun run build --release
      - name: Exercise compiled Design app
        working-directory: packages/design-app
        run: bun script/smoke.ts dist/redcode-design-linux-x64/redcode-design
      - name: Verify Design archive checksums
        working-directory: packages/design-app/dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-design-release
          path: |
            packages/design-app/dist/*.tar.gz
            packages/design-app/dist/*.zip
            packages/design-app/dist/manifest.json
            packages/design-app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    needs: [plan, sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_DESIGN_APP_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_CHANNEL: latest
      REDCODE_RELEASE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rpc-sidecar-*
          path: packages/rpc-sidecar/dist/release
          merge-multiple: true
      - name: Build Redcode native packages
        working-directory: packages/redcode
        env:
          GH_TOKEN: ${{ github.token }}
          BUN_COMPILE_RELEASE: bun-v1.4.2
          REDCODE_RPC_SIDECAR_DIR: ${{ github.workspace }}/packages/rpc-sidecar/dist/release
        run: bun run build
      - name: Exercise compiled Redcode CLI and agents
        shell: bash
        run: |
          set -euo pipefail
          binary=packages/redcode/dist/redcode-linux-x64/bin/redcode
          test -x "$binary"
          test "$("$binary" --version)" = "redcode v$REDCODE_VERSION"
          "$binary" --help > /tmp/redcode-help.txt
          grep -F 'Redcode command line interface' /tmp/redcode-help.txt
          grep -F 'design' /tmp/redcode-help.txt
          grep -F 'setup' /tmp/redcode-help.txt
          if grep -F 'OpenCode command line interface' /tmp/redcode-help.txt; then
            echo 'Redcode binary exposes the upstream product name' >&2
            exit 1
          fi
          REDCODE_TEST_HOME="$(mktemp -d)" timeout 60s "$binary" agent list --standalone --print-logs | tee /tmp/redcode-agents.txt
          for agent in build plan design question; do
            grep -E "^$agent \\(" /tmp/redcode-agents.txt
          done
      - name: Archive binaries and sidecars
        working-directory: packages/redcode
        run: bun run archive
      - name: Pack npm packages
        working-directory: packages/redcode
        run: bun run publish --pack-only
      - name: Verify archive checksums
        working-directory: packages/redcode/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-native-packages
          path: packages/redcode/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-release-archives
          path: packages/redcode/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: inputs.publish && github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main'
    needs: [plan, verify, tests, build, design]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: red-release
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_DESIGN_APP_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      REDCODE_CHANNEL: latest
      REDCODE_RELEASE: "1"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-native-packages
          path: packages/redcode/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-release-archives
          path: packages/redcode/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-design-release
          path: packages/design-app/dist
      - name: Extract reviewed release notes
        run: |
          bun -e '
            const version = process.env.REDCODE_VERSION
            const changelog = await Bun.file("packages/redcode/CHANGELOG.md").text()
            const section = changelog.split(/^## /m).find((part) => part.split(/\r?\n/, 1)[0].trim() === version)
            if (!section) throw new Error(`Missing Changesets release notes for ${version}`)
            await Bun.write("release-notes.md", `## ${section.trim()}\n`)
          '
      - name: Prepare Design release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="design-v$REDCODE_VERSION"
          (cd packages/design-app/dist && sha256sum --check SHA256SUMS)
          test "$(bun -e 'console.log((await Bun.file("packages/design-app/dist/manifest.json").json()).version)')" = "$REDCODE_VERSION"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$REDCODE_RELEASE_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$REDCODE_RELEASE_SHA" --title "Redcode Design $tag" --notes-file release-notes.md
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$tag" packages/design-app/dist/*.tar.gz packages/design-app/dist/*.zip packages/design-app/dist/manifest.json packages/design-app/dist/SHA256SUMS --clobber
          fi
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$REDCODE_VERSION"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$REDCODE_RELEASE_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$REDCODE_RELEASE_SHA" --title "Redcode $tag" --notes-file release-notes.md
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$tag" packages/redcode/release/* --clobber
          fi
      - name: Publish npm packages
        working-directory: packages/redcode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run publish
      - name: Verify published installation and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          gh release download "v$REDCODE_VERSION" --dir "$root/assets"
          (cd "$root/assets" && sha256sum --check SHA256SUMS)
          gh release download "design-v$REDCODE_VERSION" --dir "$root/design"
          (cd "$root/design" && sha256sum --check SHA256SUMS)
          test "$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).version)' "$root/design/manifest.json")" = "$REDCODE_VERSION"
          mkdir "$root/design-native"
          tar -xzf "$root/design/redcode-design-linux-x64.tar.gz" -C "$root/design-native"
          test "$("$root/design-native/redcode-design" --version)" = "$REDCODE_VERSION"
          test "$("$root/design-native/redcode-design" --protocol)" = "$(bun -e 'console.log((await Bun.file(process.argv[1]).json()).protocol)' "$root/design/manifest.json")"
          for attempt in {1..20}; do
            if tarball=$(npm view "@reddb-io/redcode@$REDCODE_VERSION" dist.tarball --prefer-online 2>/dev/null) &&
              [ -n "$tarball" ] && curl --fail --silent --show-error --head --location --max-time 30 "$tarball" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "@reddb-io/redcode@$REDCODE_VERSION metadata or tarball did not reach npm after 10 minutes" >&2
              exit 1
            fi
            sleep 30
          done
          npm install --prefer-online --prefix "$root/install" --ignore-scripts --no-audit --no-fund "@reddb-io/redcode@$REDCODE_VERSION"
          test "$("$root/install/node_modules/.bin/redcode" --version)" = "redcode v$REDCODE_VERSION"
          test -x "$root/install/node_modules/@reddb-io/redcode-linux-x64/bin/redcode-rpc-sidecar"
          test "$(npm view "@reddb-io/redcode@$REDCODE_VERSION" version --prefer-online)" = "$REDCODE_VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        shell: bash
        run: |
          gh release edit "design-v$REDCODE_VERSION" --draft=false
          gh release edit "v$REDCODE_VERSION" --draft=false
