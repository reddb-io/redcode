name: redcode

on:
  workflow_dispatch:
    inputs:
      workers_only:
        type: boolean
        description: Qualify company sidecar and Design builders without desktop, assembly or publication
        default: false
      run_smoke:
        type: boolean
        description: Run the extra built-binary Design smoke before publication
        default: false
      version:
        description: "Optional expected version; must match the Changesets release plan"
        required: false
        type: string
      publish:
        description: "Publish verified archives and npm packages"
        required: true
        default: false
        type: boolean
      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false
concurrency:
  group: redcode-${{ inputs.workers_only && 'worker-qualification' || (github.event_name == 'workflow_dispatch' && 'release' || github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  GH_REPO: reddb-io/redcode
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
      matrix_sidecar: ${{ steps.select.outputs.matrix_sidecar }}
      enabled_sidecar: ${{ steps.select.outputs.enabled_sidecar }}
      matrix_desktop: ${{ steps.select.outputs.matrix_desktop }}
      enabled_desktop: ${{ steps.select.outputs.enabled_desktop }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["linux_arm64", "linux_x64", "macos_arm64", "macos_x64", "windows_arm64", "windows_x64"]'
          PLATFORM_MATRICES: |
            {
              "sidecar": [
                {
                  "flag": "linux_x64",
                  "row": {
                    "name": "linux-x64",
                    "host": "ubuntu-latest",
                    "target": "x86_64-linux-gnu.2.29",
                    "file": "redcode-rpc-sidecar-linux-x64"
                  }
                },
                {
                  "flag": "linux_arm64",
                  "row": {
                    "name": "linux-arm64",
                    "host": "ubuntu-latest",
                    "target": "aarch64-linux-gnu.2.29",
                    "file": "redcode-rpc-sidecar-linux-arm64"
                  }
                },
                {
                  "flag": "linux_x64",
                  "row": {
                    "name": "linux-x64-musl",
                    "host": "ubuntu-latest",
                    "target": "x86_64-linux-musl",
                    "file": "redcode-rpc-sidecar-linux-x64-musl"
                  }
                },
                {
                  "flag": "linux_arm64",
                  "row": {
                    "name": "linux-arm64-musl",
                    "host": "ubuntu-latest",
                    "target": "aarch64-linux-musl",
                    "file": "redcode-rpc-sidecar-linux-arm64-musl"
                  }
                },
                {
                  "flag": "windows_x64",
                  "row": {
                    "name": "windows-x64",
                    "host": "ubuntu-latest",
                    "target": "x86_64-windows-gnu",
                    "file": "redcode-rpc-sidecar-windows-x64.exe"
                  }
                },
                {
                  "flag": "windows_arm64",
                  "row": {
                    "name": "windows-arm64",
                    "host": "ubuntu-latest",
                    "target": "aarch64-windows-gnu",
                    "file": "redcode-rpc-sidecar-windows-arm64.exe"
                  }
                },
                {
                  "flag": "macos_x64",
                  "row": {
                    "name": "darwin-x64",
                    "host": "macos-15-intel",
                    "target": "",
                    "file": "redcode-rpc-sidecar-darwin-x64"
                  }
                },
                {
                  "flag": "macos_arm64",
                  "row": {
                    "name": "darwin-arm64",
                    "host": "macos-15",
                    "target": "",
                    "file": "redcode-rpc-sidecar-darwin-arm64"
                  }
                }
              ],
              "desktop": [
                {
                  "flag": "linux_x64",
                  "row": {
                    "name": "linux-x64",
                    "host": "ubuntu-latest",
                    "os": "linux",
                    "arch": "x64"
                  }
                },
                {
                  "flag": "linux_arm64",
                  "row": {
                    "name": "linux-arm64",
                    "host": "ubuntu-24.04-arm",
                    "os": "linux",
                    "arch": "arm64"
                  }
                },
                {
                  "flag": "macos_x64",
                  "row": {
                    "name": "darwin-x64",
                    "host": "macos-15-intel",
                    "os": "mac",
                    "arch": "x64"
                  }
                },
                {
                  "flag": "macos_arm64",
                  "row": {
                    "name": "darwin-arm64",
                    "host": "macos-15",
                    "os": "mac",
                    "arch": "arm64"
                  }
                },
                {
                  "flag": "windows_x64",
                  "row": {
                    "name": "windows-x64",
                    "host": "windows-2025",
                    "os": "win",
                    "arch": "x64"
                  }
                },
                {
                  "flag": "windows_arm64",
                  "row": {
                    "name": "windows-arm64",
                    "host": "windows-11-arm",
                    "os": "win",
                    "arch": "arm64"
                  }
                }
              ]
            }
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  plan:
    if: ${{ !inputs.preview_platforms && ((github.repository == 'reddb-io/redcode') && (needs.platforms.outputs.any == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha || steps.current.outputs.sha }}
    steps:
      - name: Validate release owner and branch
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          WORKERS_ONLY: ${{ inputs.workers_only }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'reddb-io/redcode'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [ "$WORKERS_ONLY" = true ] && [ "$PUBLISH" = true ]; then
            echo '::error::Worker qualification requires publish=false.'
            exit 1
          fi
          if [ -n "$EXPECTED_VERSION" ]; then
            [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          token: ${{ inputs.publish && secrets.RELEASE_PAT || github.token }}
      - name: Select source for checks and worker qualification
        if: github.event_name != 'workflow_dispatch' || inputs.workers_only
        id: current
        run: |
          echo "version=$(node -p 'require("./packages/redcode/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bun
        if: github.event_name == 'workflow_dispatch' && !inputs.workers_only
      - name: Prepare Changesets release on main
        if: github.event_name == 'workflow_dispatch' && !inputs.workers_only
        id: prepare
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          bun run release:status --output /tmp/redcode-release-plan.json
          if [ "$(bun -p 'require("/tmp/redcode-release-plan.json").releases.length > 0')" = 'true' ]; then
            bun run release:version
          fi
          version=$(bun -p 'require("./packages/redcode/package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "::error::Changesets selected $version, but the requested version was $EXPECTED_VERSION."
            exit 1
          fi
          bun install --lockfile-only --ignore-scripts
          if [ "$PUBLISH" = 'true' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .changeset packages/redcode/package.json bun.lock
            if [ -f packages/redcode/CHANGELOG.md ]; then
              git add -- packages/redcode/CHANGELOG.md
            fi
            if ! git diff --cached --quiet; then
              HUSKY=0 git commit -m "chore(release): version Redcode $version"
              HUSKY=0 git push origin HEAD:main
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Redcode release plan"
            echo "Version: $version"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Publish: $PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

    needs:
      - platforms
  sidecar:
    if: ${{ !inputs.preview_platforms && ((github.event_name == 'workflow_dispatch') && (needs.platforms.outputs.enabled_sidecar == 'true')) }}
    needs:
      - plan
      - platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix_sidecar) }}
    runs-on: ${{ github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main' && matrix.host == 'ubuntu-latest' && 'reddb-public-linux-x64' || matrix.host }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-runner
        if: runner.environment == 'self-hosted'
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter=@reddb-io/redcode-rpc-sidecar
      - name: Install pinned Zig cross compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file=zig-x86_64-linux-0.17.0-dev.1857+3c46da14d.tar.xz
          for base in https://ziglang.org/builds https://pkg.hexops.org/zig https://zig.squirl.dev https://zig.tilok.dev https://pkg.earth/zig https://zig.bcr.ist https://zig.chainsafe.dev; do
            # A stalled mirror must yield to the next one instead of occupying the runner until the job times out.
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 90 --speed-limit 1024 --speed-time 15 \
              --retry 2 --retry-max-time 120 --output /tmp/redcode-zig.tar.xz "$base/$file" &&
              echo "0825e4a55baf4a6647c3ce3077a7236c9ffec5b17e1ca0102a930fe33d631bc6  /tmp/redcode-zig.tar.xz" | sha256sum --check -; then
              break
            fi
            rm -f /tmp/redcode-zig.tar.xz
          done
          test -f /tmp/redcode-zig.tar.xz
          tar -xf /tmp/redcode-zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.0-dev.1857+3c46da14d" >> "$GITHUB_PATH"
      - name: Build native sidecar
        working-directory: packages/rpc-sidecar
        env:
          REDCODE_RPC_SIDECAR_OUTPUT: dist/release/${{ matrix.file }}
          REDCODE_RPC_SIDECAR_TARGET: ${{ matrix.target }}
        run: bun run build
      - name: Exercise native sidecar
        if: matrix.name == 'linux-x64' || matrix.name == 'darwin-x64' || matrix.name == 'darwin-arm64'
        working-directory: packages/rpc-sidecar
        env:
          REDCODE_RPC_SIDECAR_COMMAND: ${{ github.workspace }}/packages/rpc-sidecar/dist/release/${{ matrix.file }}
        run: bun test test/sidecar.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpc-sidecar-${{ matrix.name }}
          path: packages/rpc-sidecar/dist/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  design:
    if: ${{ !inputs.preview_platforms && (github.event_name == 'workflow_dispatch') }}
    needs: plan
    runs-on: ${{ github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main' && 'reddb-public-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      REDCODE_DESIGN_APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-runner
        if: runner.environment == 'self-hosted'
      - uses: ./.github/actions/setup-bun
      - name: Build the optional whiteboard bundle
        working-directory: packages/design-app
        env:
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bun ../cli/script/whiteboard-bundle.ts --archive
          mkdir -p dist
          cp "../cli/dist/redcode-whiteboard-$REDCODE_DESIGN_APP_VERSION.tar.gz" dist/
      - name: Pack the whiteboard bundle for the Redcode build
        working-directory: packages/design-app/dist
        run: tar -cf "$RUNNER_TEMP/redcode-design-dist.tar" "redcode-whiteboard-$REDCODE_DESIGN_APP_VERSION.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-design-dist
          path: ${{ runner.temp }}/redcode-design-dist.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && ((github.event_name == 'workflow_dispatch') && (needs.platforms.outputs.enabled_desktop == 'true')) }}
    needs:
      - plan
      - platforms
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      # Each app is built on its own OS and architecture, so node-pty and Electron match without cross-compiling.
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix_desktop) }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      REDCODE_DESKTOP_CHANNEL: prod
      REDCODE_DESKTOP_ARCH: ${{ matrix.arch }}
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - name: Prepare Electron runtime
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if node -e "require('child_process').execFileSync(process.execPath, [require.resolve('electron/install.js')], {stdio: 'inherit'})"; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              echo '::error::Electron runtime download failed after 5 attempts.'
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      # The shell is the same everywhere; one platform keeps the matrix fast.
      - name: Typecheck and test the desktop shell
        if: matrix.name == 'linux-x64'
        run: |
          bun run typecheck
          bun run test
      - name: Test Desktop CLI startup diagnostics on the native OS
        working-directory: packages/cli
        run: bun test test/desktop.test.ts
      # Releases are not signed yet; electron-builder must not look for certificates or try to publish.
      - name: Build the unpacked app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run build
          for attempt in 1 2 3 4 5; do
            if bunx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --dir --publish never --config electron-builder.config.ts; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              echo '::error::Desktop packaging failed after 5 attempts.'
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      # REDCODE_DESKTOP_DIST/<os>-<arch>/ holds exactly what goes under desktop/ beside redcode: the contents of
      # electron-builder's *-unpacked folder, or Redcode.app on macOS. upload-artifact drops file modes and
      # symlinks, so the folder travels as a tar. tar only sees relative names: GNU tar on Windows reads `D:` as a host.
      - name: Normalize and pack the unpacked app
        env:
          NAME: ${{ matrix.name }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          cd dist
          if [ "$OS" = mac ]; then set -- mac*/Redcode.app; else set -- *-unpacked; fi
          test "$#" -eq 1
          test -e "$1"
          mkdir -p "normalized/$NAME"
          if [ "$OS" = mac ]; then
            tar -cf - -C "$(dirname "$1")" Redcode.app | tar -xf - -C "normalized/$NAME"
            test -x "normalized/$NAME/Redcode.app/Contents/MacOS/Redcode"
          else
            tar -cf - -C "$1" . | tar -xf - -C "normalized/$NAME"
            if [ "$OS" = win ]; then test -f "normalized/$NAME/Redcode.exe"; else test -x "normalized/$NAME/io.reddb.redcode"; fi
          fi
          tar -cf "desktop-$NAME.tar" -C normalized "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.name }}
          path: packages/desktop/dist/desktop-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 7

  build:
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && (github.event_name == 'workflow_dispatch') }}
    needs:
      - plan
      - sidecar
      - design
      - desktop
      - platforms
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_DESIGN_APP_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_CHANNEL: latest
      REDCODE_RELEASE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rpc-sidecar-*
          path: packages/rpc-sidecar/dist/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-design-dist
          path: ${{ runner.temp }}/design-artifact
      - name: Extract Design app binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/design-dist"
          tar -xf "$RUNNER_TEMP/design-artifact/redcode-design-dist.tar" -C "$RUNNER_TEMP/design-dist"
          echo "REDCODE_DESIGN_DIST=$RUNNER_TEMP/design-dist" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop-artifact
          merge-multiple: true
      - name: Extract the unpacked desktop apps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-dist"
          for file in "$RUNNER_TEMP"/desktop-artifact/desktop-*.tar; do
            tar -xf "$file" -C "$RUNNER_TEMP/desktop-dist"
          done
          mapfile -t targets < <(jq -r '.include[].name' <<< "$DESKTOP_MATRIX")
          for target in "${targets[@]}"; do
            test -d "$RUNNER_TEMP/desktop-dist/$target"
          done
          echo "REDCODE_DESKTOP_DIST=$RUNNER_TEMP/desktop-dist" >> "$GITHUB_ENV"
        env:
          DESKTOP_MATRIX: ${{ needs.platforms.outputs.matrix_desktop }}
      - name: Build Redcode native packages
        working-directory: packages/redcode
        env:
          GH_TOKEN: ${{ github.token }}
          BUN_COMPILE_RELEASE: bun-v1.4.2
          REDCODE_RPC_SIDECAR_DIR: ${{ github.workspace }}/packages/rpc-sidecar/dist/release
        run: bun run build
      - name: Exercise compiled Redcode CLI and agents
        shell: bash
        run: |
          set -euo pipefail
          binary=packages/redcode/dist/redcode-linux-x64/bin/redcode
          test -x "$binary"
          test "$("$binary" --version)" = "redcode v$REDCODE_VERSION"
          "$binary" --help > /tmp/redcode-help.txt
          grep -F 'Redcode command line interface' /tmp/redcode-help.txt
          grep -F 'design' /tmp/redcode-help.txt
          grep -F 'desktop' /tmp/redcode-help.txt
          grep -F 'setup' /tmp/redcode-help.txt
          if grep -F 'OpenCode command line interface' /tmp/redcode-help.txt; then
            echo 'Redcode binary exposes the upstream product name' >&2
            exit 1
          fi
          REDCODE_TEST_HOME="$(mktemp -d)" timeout 60s "$binary" agent list --standalone --print-logs | tee /tmp/redcode-agents.txt
          for agent in build plan design question; do
            grep -E "^$agent \\(" /tmp/redcode-agents.txt
          done
          test "$("$binary" __design-app --version)" = "$REDCODE_VERSION"
        if: env.ENABLE_LINUX_X64 == 'true'
      - name: Exercise the embedded Design child process
        working-directory: packages/design-app
        run: bun script/smoke.ts ../redcode/dist/redcode-linux-x64/bin/redcode --embedded
        if: env.ENABLE_LINUX_X64 == 'true'
      - name: Archive full and server distributions
        working-directory: packages/redcode
        run: bun run archive
      - name: Verify the desktop app in the archives and not in the npm packages
        working-directory: packages/redcode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in release/redcode-*.tar.gz release/redcode-*.zip; do
            case "$archive" in
              *whiteboard*) continue ;;
              *.zip) listing=$(unzip -Z1 "$archive") ;;
              *) listing=$(tar -tzf "$archive") ;;
            esac
            case "$archive" in
              *server-*|*musl*)
                if grep '^desktop/' <<< "$listing"; then
                  echo "Unexpected desktop app in $archive" >&2
                  exit 1
                fi ;;
              *darwin*) grep -Fx 'desktop/Redcode.app/Contents/MacOS/Redcode' <<< "$listing" ;;
              *windows*) grep -Fx 'desktop/Redcode.exe' <<< "$listing" ;;
              *)
                grep -Fx 'desktop/io.reddb.redcode' <<< "$listing"
                grep -Fx 'desktop/resources/app.asar' <<< "$listing"
                tar -tzvf "$archive" | grep -E '^-rwx.* desktop/io\.reddb\.redcode$' ;;
            esac
            if [[ "$archive" == *.zip ]]; then
              grep -Fx 'redcode.exe' <<< "$listing"
              grep -Fx 'redcode-rpc-sidecar.exe' <<< "$listing"
            fi
          done
          if compgen -G 'dist/redcode-desktop-*' > /dev/null; then
            echo 'The npm packages must not carry the desktop app' >&2
            exit 1
          fi
      - name: Pack npm packages
        working-directory: packages/redcode
        run: bun run publish --pack-only
      - name: Verify archive checksums
        working-directory: packages/redcode/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-native-packages
          path: packages/redcode/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-release-archives
          path: packages/redcode/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # The smoke job tests the exact archive users install without downloading every platform.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-smoke-linux-x64
          path: packages/redcode/release/redcode-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

        if: env.ENABLE_LINUX_X64 == 'true'
  smoke:
    # Exercise the exact shipped archive in a fresh home before publication, without model credentials.
    name: smoke (built binary)
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && (inputs.run_smoke && needs.platforms.outputs.linux_x64 == 'true') }}
    needs:
      - plan
      - build
      - platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter=@opencode/core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-smoke-linux-x64
          path: ${{ runner.temp }}/redcode-archive
      - name: Extract the shipped Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redcode"
          tar -xzf "$RUNNER_TEMP/redcode-archive/redcode-linux-x64.tar.gz" -C "$RUNNER_TEMP/redcode"
          test -x "$RUNNER_TEMP/redcode/redcode"
          test -x "$RUNNER_TEMP/redcode/redcode-rpc-sidecar"
          test "$("$RUNNER_TEMP/redcode/redcode" __design-app --version)" = "$REDCODE_VERSION"
      # No display here: `redcode desktop --path` resolves the app beside redcode without opening it.
      - name: Resolve the desktop app beside the built binary
        shell: bash
        run: |
          set -euo pipefail
          app=$(REDCODE_TEST_HOME="$(mktemp -d)" "$RUNNER_TEMP/redcode/redcode" desktop --path | tail -n 1)
          test "$app" = "$RUNNER_TEMP/redcode/desktop/io.reddb.redcode"
          test -x "$app"
      - name: Install headless Chromium for the Design review
        run: node packages/core/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      # Without --design-bin, Redcode starts its embedded Design entry in a separate process.
      - name: Smoke-test the built binary
        timeout-minutes: 8
        env:
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          bun script/smoke/run.ts \
            --binary "$RUNNER_TEMP/redcode/redcode" \
            --version "$REDCODE_VERSION" \
            --design \
            --artifacts "$RUNNER_TEMP/smoke-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: redcode-smoke-results
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          retention-days: 7

  publish_github:
    name: publish (GitHub)
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && (always() && !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && needs.design.result == 'success' && (!inputs.run_smoke || needs.platforms.outputs.linux_x64 == 'false' || needs.smoke.result == 'success') && (inputs.publish && github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main')) }}
    needs:
      - plan
      - build
      - design
      - smoke
      - platforms
    runs-on: ubuntu-latest
    # Each release carries the desktop app per platform, about 1.5 GB of uploads and downloads.
    timeout-minutes: 90
    environment: red-release
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      REDCODE_CHANNEL: latest
      REDCODE_RELEASE: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter=@reddb-io/redcode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-release-archives
          path: packages/redcode/release
      - name: Extract reviewed release notes
        run: |
          bun -e '
            const version = process.env.REDCODE_VERSION
            const changelog = await Bun.file("packages/redcode/CHANGELOG.md").text()
            const section = changelog.split(/^## /m).find((part) => part.split(/\r?\n/, 1)[0].trim() === version)
            if (!section) throw new Error(`Missing Changesets release notes for ${version}`)
            await Bun.write("release-notes.md", `## ${section.trim()}\n`)
          '
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$REDCODE_VERSION"
          (cd packages/redcode/release && sha256sum --check SHA256SUMS)
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$REDCODE_RELEASE_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$REDCODE_RELEASE_SHA" --title "Redcode $tag" --notes-file release-notes.md
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$tag" packages/redcode/release/* --clobber
          fi
      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          gh release download "v$REDCODE_VERSION" --dir "$root/assets"
          (cd "$root/assets" && sha256sum --check SHA256SUMS)
          test -f "$root/assets/redcode-whiteboard-$REDCODE_VERSION.tar.gz"
          if [[ "$ENABLE_LINUX_X64" == true ]]; then
          mkdir "$root/cli-native"
          tar -xzf "$root/assets/redcode-linux-x64.tar.gz" -C "$root/cli-native"
          test "$("$root/cli-native/redcode" --version)" = "redcode v$REDCODE_VERSION"
          test -x "$root/cli-native/redcode-rpc-sidecar"
          # The design app must speak the protocol of the redcode source this release was built from.
          protocol=$(sed -n 's/^export const PROTOCOL = \([0-9][0-9]*\)$/\1/p' packages/core/src/design/app.ts)
          test -n "$protocol"
          test "$("$root/cli-native/redcode" __design-app --version)" = "$REDCODE_VERSION"
          test "$("$root/cli-native/redcode" __design-app --protocol)" = "$protocol"
          test -x "$root/cli-native/desktop/io.reddb.redcode"
          app=$(REDCODE_TEST_HOME="$root/home" "$root/cli-native/redcode" desktop --path | tail -n 1)
          test "$app" = "$root/cli-native/desktop/io.reddb.redcode"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        shell: bash
        run: |
          gh release edit "v$REDCODE_VERSION" --draft=false
          test "$(gh release view "v$REDCODE_VERSION" --json isDraft --jq .isDraft)" = 'false'

  publish_npm:
    name: publish (npm)
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && (always() && !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && needs.design.result == 'success' && (!inputs.run_smoke || needs.platforms.outputs.linux_x64 == 'false' || needs.smoke.result == 'success') && (inputs.publish && github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main')) }}
    needs:
      - plan
      - build
      - design
      - smoke
      - platforms
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: red-release
    env:
      REDCODE_VERSION: ${{ needs.plan.outputs.version }}
      REDCODE_CHANNEL: latest
      REDCODE_RELEASE: "1"
      NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'token' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --filter=@reddb-io/redcode
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm with trusted publishing support
        env:
          NODE_AUTH_TOKEN: ""
        run: npm install --global npm@11.20.0
      - name: Validate npm authentication before downloading native packages
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_PUBLISH_MODE != 'oidc' && secrets.NPM_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          case "$NPM_PUBLISH_MODE" in
            token)
              if [ -z "$NODE_AUTH_TOKEN" ]; then
                echo '::error::NPM_PUBLISH_MODE=token requires NPM_TOKEN in the red-release environment or repository/organization.'
                exit 1
              fi
              npm whoami --registry https://registry.npmjs.org
              ;;
            oidc)
              test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
              test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
              echo 'Using OIDC without a token fallback; each npm package must allow direct publishing from redcode.yml.'
              ;;
            *)
              echo '::error::NPM_PUBLISH_MODE must be token or oidc.'
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: redcode-native-packages
          path: packages/redcode/dist
      - name: Publish npm packages
        working-directory: packages/redcode
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_PUBLISH_MODE != 'oidc' && secrets.NPM_TOKEN || '' }}
        run: bun run publish
      - name: Verify anonymous registry access and installed native package
        env:
          NODE_AUTH_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          for attempt in {1..20}; do
            if tarball=$(npm view "@reddb-io/redcode@$REDCODE_VERSION" dist.tarball --prefer-online 2>/dev/null) &&
              [ -n "$tarball" ] && curl --fail --silent --show-error --head --location --max-time 30 "$tarball" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "@reddb-io/redcode@$REDCODE_VERSION metadata or tarball did not reach npm after 10 minutes" >&2
              exit 1
            fi
            sleep 30
          done
          if [[ "$ENABLE_LINUX_X64" == true ]]; then
          npm install --prefer-online --prefix "$root/install" --ignore-scripts --no-audit --no-fund "@reddb-io/redcode@$REDCODE_VERSION"
          test "$("$root/install/node_modules/.bin/redcode" --version)" = "redcode v$REDCODE_VERSION"
          test -x "$root/install/node_modules/@reddb-io/redcode-linux-x64-baseline/bin/redcode-rpc-sidecar"
          test "$(find "$root/install/node_modules/@reddb-io" -mindepth 1 -maxdepth 1 -type d -name 'redcode-linux-*' | wc -l)" -eq 1
          test "$("$root/install/node_modules/.bin/redcode" __design-app --version)" = "$REDCODE_VERSION"
          # The desktop app ships only in the release archives; npm points to them.
          if REDCODE_TEST_HOME="$root/home" "$root/install/node_modules/.bin/redcode" desktop --path > "$root/desktop.txt" 2>&1; then
            echo 'redcode desktop must fail in an npm install' >&2
            exit 1
          fi
          grep -F 'not included in the npm package' "$root/desktop.txt"
          test "$(npm view "@reddb-io/redcode@$REDCODE_VERSION" version --prefer-online)" = "$REDCODE_VERSION"
          fi

  release_status:
    name: release status
    if: ${{ !inputs.workers_only && !inputs.preview_platforms && (always() && inputs.publish && github.repository == 'reddb-io/redcode' && github.ref == 'refs/heads/main') && needs.platforms.outputs.any == 'true' }}
    needs: [plan, publish_github, publish_npm, platforms]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report each destination and require both publications to succeed
        env:
          REDCODE_VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_RESULT: ${{ needs.publish_github.result }}
          NPM_RESULT: ${{ needs.publish_npm.result }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const github = process.env.GITHUB_RESULT
          const npm = process.env.NPM_RESULT
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Redcode ' + process.env.REDCODE_VERSION + '\n\n' +
            '| Destination | Result |\n| --- | --- |\n' +
            '| GitHub release (CLI, design and desktop apps) | ' + github + ' |\n' +
            '| npm main and native packages (Design embedded) | ' + npm + ' |\n')
          if (github !== 'success' || npm !== 'success') {
            console.error('Release incomplete: GitHub=' + github + ', npm=' + npm)
            process.exitCode = 1
          }
          NODE
