name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: typecheck scope
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.release.outputs.release_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: release
        uses: ./.github/actions/release-only
        with:
          event: ${{ github.event_name }}
          head-ref: ${{ github.head_ref }}
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
          repository: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  shard:
    name: typecheck (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # One slice of the workspace per job: all 37 packages at once is more than a 4-vCPU runner
      # can hold, and the job that tried used to die mid-run. Three shards keep each job well
      # inside memory while spending far less on per-job setup than five did. Assignment is by
      # sorted package name (see script/typecheck-shard.ts), so a failure names the package.
      - name: Run typecheck
        run: bun script/typecheck-shard.ts $((${{ matrix.shard }} - 1)) 3

  # The one check branch protection requires. It passes only when every shard did, so the
  # protection rule keeps its name and the matrix can change shape underneath it.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [changes, shard]
    if: always()
    steps:
      - name: Every shard passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          echo "shards: $SHARD_RESULT"
          test "$SHARD_RESULT" = success
