name: red-publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft Redcode tag to reconcile, e.g. v0.1.1"
        required: true
        type: string
      npm_only:
        description: "Skip the GitHub Release and only publish npm packages, for a tag whose GitHub Release is already published"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: red-publish
  cancel-in-progress: false

jobs:
  sidecar:
    if: github.repository == 'reddb-io/redcode'
    name: sidecar (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            host: ubuntu-latest
            target: x86_64-linux-gnu.2.29
            file: redcode-rpc-sidecar-linux-x64
            identity: "ELF 64-bit LSB executable, x86-64"
            linkage: dynamically linked
          - name: linux-arm64
            host: ubuntu-latest
            target: aarch64-linux-gnu.2.29
            file: redcode-rpc-sidecar-linux-arm64
            identity: "ELF 64-bit LSB executable, ARM aarch64"
            linkage: dynamically linked
          - name: linux-x64-musl
            host: ubuntu-latest
            target: x86_64-linux-musl
            file: redcode-rpc-sidecar-linux-x64-musl
            identity: "ELF 64-bit LSB executable, x86-64"
            linkage: statically linked
          - name: linux-arm64-musl
            host: ubuntu-latest
            target: aarch64-linux-musl
            file: redcode-rpc-sidecar-linux-arm64-musl
            identity: "ELF 64-bit LSB executable, ARM aarch64"
            linkage: statically linked
          - name: windows-x64
            host: ubuntu-latest
            target: x86_64-windows-gnu
            file: redcode-rpc-sidecar-windows-x64.exe
            identity: "PE32+ executable (console) x86-64"
            linkage: ""
          - name: windows-arm64
            host: ubuntu-latest
            target: aarch64-windows-gnu
            file: redcode-rpc-sidecar-windows-arm64.exe
            identity: "PE32+ executable (console) Aarch64"
            linkage: ""
          - name: darwin-x64
            host: macos-15-intel
            target: ""
            deployment: "11.0"
            developer: /Applications/Xcode_16.4.app/Contents/Developer
            file: redcode-rpc-sidecar-darwin-x64
            identity: "Mach-O 64-bit executable x86_64"
            linkage: ""
          - name: darwin-arm64
            host: macos-15
            target: ""
            deployment: "11.0"
            developer: /Applications/Xcode_16.4.app/Contents/Developer
            file: redcode-rpc-sidecar-darwin-arm64
            identity: "Mach-O 64-bit executable arm64"
            linkage: ""
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
          node-version: 24.11.1
      - name: Install sidecar compiler only
        shell: bash
        run: |
          set -euo pipefail
          # Keep the compiler's inherited tsconfig available without installing the workspace.
          compiler=$(node -p "require('./packages/rpc-sidecar/package.json').devDependencies.scriptc")
          tsconfig=$(node -p "require('./package.json').workspaces.catalog['@tsconfig/bun']")
          npm install --prefix "$RUNNER_TEMP/redcode-sidecar-toolchain" --no-audit --no-fund --package-lock=false "scriptc@$compiler" "@tsconfig/bun@$tsconfig"
          # npm does not apply Bun's runtime patch for the supported older glibc targets.
          runtime_patch=$(node -p "require('./package.json').patchedDependencies['@scriptc/runtime@$compiler']")
          git -C "$RUNNER_TEMP/redcode-sidecar-toolchain/node_modules/@scriptc/runtime" apply --unidiff-zero "$GITHUB_WORKSPACE/$runtime_patch"
          ln -s "$RUNNER_TEMP/redcode-sidecar-toolchain/node_modules" packages/rpc-sidecar/node_modules
      - name: Install pinned Zig toolchain
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/zig.tar.xz https://ziglang.org/builds/zig-x86_64-linux-0.17.0-dev.1857+3c46da14d.tar.xz
          echo "0825e4a55baf4a6647c3ce3077a7236c9ffec5b17e1ca0102a930fe33d631bc6  /tmp/zig.tar.xz" | sha256sum --check -
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.0-dev.1857+3c46da14d" >> "$GITHUB_PATH"
      - name: Build RPC sidecar
        working-directory: packages/rpc-sidecar
        env:
          DEVELOPER_DIR: ${{ matrix.developer }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          REDCODE_RPC_SIDECAR_OUTPUT: dist/release/${{ matrix.file }}
          REDCODE_RPC_SIDECAR_TARGET: ${{ matrix.target }}
        run: bun run build
      - name: Verify RPC sidecar target
        run: |
          set -euo pipefail
          metadata="$(file "packages/rpc-sidecar/dist/release/${{ matrix.file }}")"
          grep -F "${{ matrix.identity }}" <<<"$metadata"
          if [ -n "${{ matrix.linkage }}" ]; then grep -F "${{ matrix.linkage }}" <<<"$metadata"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rpc-sidecar-${{ matrix.name }}
          path: packages/rpc-sidecar/dist/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  # Builds the binaries, uploads them to the draft GitHub Release, smokes the uploaded asset, and
  # publishes the release. mise installs from these assets, so npm must never block this job.
  release:
    if: github.repository == 'reddb-io/redcode'
    needs: sidecar
    runs-on: ubuntu-latest
    environment:
      name: red-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must match v<major>.<minor>.<patch>"
            exit 1
          fi
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bun
      - name: Verify tag contract
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bun script/red-version.ts "${TAG#v}" --check
      - name: Create or resume draft GitHub Release
        if: ${{ !inputs.npm_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "Redcode $TAG"
            exit 0
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::released tags are immutable; publish a new patch version instead of replacing $TAG, or rerun with npm_only to publish only the npm packages"
            exit 1
          fi
          echo "resuming existing draft $TAG"
      - name: Require a published GitHub Release for npm-only runs
        if: ${{ inputs.npm_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::npm_only needs the GitHub Release $TAG to exist and be published"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rpc-sidecar-*
          path: packages/rpc-sidecar/dist/release
          merge-multiple: true
      # npm_only rebuilds the npm packages without touching the published release assets.
      - name: Build and upload native binaries
        env:
          GH_REPO: reddb-io/redcode
          GH_TOKEN: ${{ github.token }}
          REDCODE_RELEASE: "1"
          REDCODE_RPC_SIDECAR_DIR: ${{ github.workspace }}/packages/rpc-sidecar/dist/release
          VERSION: ${{ steps.release.outputs.version }}
          NPM_ONLY: ${{ inputs.npm_only && 'true' || '' }}
        run: REDCODE_VERSION="$VERSION" ./packages/redcode/script/build.ts ${NPM_ONLY:+--skip-upload}
      - name: Normalize native npm metadata
        run: |
          bun -e '
          import path from "path"
          const root = "packages/redcode/dist"
          const files = Array.from(new Bun.Glob("*/package.json").scanSync({ cwd: root }))
          if (files.length === 0) throw new Error("no native package manifests were built")
          await Promise.all(files.map(async (file) => {
            const target = path.join(root, file)
            const manifest = await Bun.file(target).json()
            await Bun.write(target, `${JSON.stringify({ ...manifest, repository: { type: "git", url: "https://github.com/reddb-io/redcode" } }, null, 2)}\n`)
          }))
          '
      - name: Smoke the uploaded GitHub Release asset
        if: ${{ !inputs.npm_only }}
        env:
          GH_REPO: reddb-io/redcode
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          # Download what mise users will download, not the local build output.
          gh release download "$TAG" --dir "$root" --pattern redcode-linux-x64.tar.gz --pattern SHA256SUMS
          (cd "$root" && grep -E '  redcode-linux-x64\.tar\.gz$' SHA256SUMS | sha256sum --check -)
          mkdir "$root/bin"
          tar -xzf "$root/redcode-linux-x64.tar.gz" -C "$root/bin"
          "$root/bin/redcode" --version | grep -Fx "$VERSION"
          test -x "$root/bin/redcode-rpc-sidecar"
      - name: Publish GitHub Release
        if: ${{ !inputs.npm_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
      # tar keeps the executable bits that upload-artifact would drop.
      - name: Bundle npm packages for the npm job
        run: |
          set -euo pipefail
          packages=()
          for manifest in packages/redcode/dist/*/package.json; do
            name="$(node -p 'require(process.argv[1]).name' "$PWD/$manifest")"
            if [[ "$name" == @reddb-io/redcode-* ]]; then packages+=("$(basename "$(dirname "$manifest")")"); fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no platform package manifests found under packages/redcode/dist"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/npm-packages.tar.gz" -C packages/redcode/dist "${packages[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages.tar.gz
          if-no-files-found: error
          # Staged versions can wait days for approval; keep the bundle so the npm job can be rerun.
          retention-days: 7
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

  # Publishes to npm after the GitHub Release is out. A failure here (for example a version npm
  # staged for 2FA approval) leaves the GitHub Release untouched; rerun this job once it is fixed.
  npm:
    if: github.repository == 'reddb-io/redcode'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: red-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ./.github/actions/setup-bun
      # Trusted publishing needs npm 11.5.1 or newer: https://docs.npmjs.com/trusted-publishers
      - name: Install npm with trusted publishing support
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm --version | grep -Fx 11.6.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-packages
          path: ${{ runner.temp }}
      - name: Restore npm packages
        run: |
          set -euo pipefail
          mkdir -p packages/redcode/dist
          tar -xzf "$RUNNER_TEMP/npm-packages.tar.gz" -C packages/redcode/dist
      # Recovery: rerunning this job is safe. publish.ts skips versions npm already serves, treats
      # an E409 "cannot publish over previously published version" as already published, fails
      # with approval steps when npm staged a version, and only publishes @reddb-io/redcode once
      # every platform package is visible on npm.
      #
      # NPM_PUBLISH_MODE (repository variable): unset or "oidc" publishes through npm trusted
      # publishing with no stored token; "token" is the fallback that uses the NPM_TOKEN secret
      # until every package has a trusted publisher. npm may stage token publishes for approval.
      - name: Publish native packages and @reddb-io/redcode
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
          NPM_TOKEN: ${{ vars.NPM_PUBLISH_MODE == 'token' && secrets.NPM_TOKEN || '' }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          case "${NPM_PUBLISH_MODE:-oidc}" in
            token)
              if [ -z "${NPM_TOKEN:-}" ]; then
                echo "::error::NPM_PUBLISH_MODE=token but the NPM_TOKEN secret is absent — cannot publish @reddb-io/redcode@${VERSION}"
                exit 1
              fi
              echo "::warning::publishing with NPM_TOKEN; npm may stage these versions until a maintainer approves them with 2FA"
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
              npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
              ;;
            oidc)
              if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                echo "::error::trusted publishing needs the id-token: write permission"
                exit 1
              fi
              # npm exchanges the GitHub OIDC token itself; make sure no stale token wins.
              unset NODE_AUTH_TOKEN
              npm config delete //registry.npmjs.org/:_authToken || true
              ;;
            *)
              echo "::error::NPM_PUBLISH_MODE must be unset, oidc, or token (got ${NPM_PUBLISH_MODE})"
              exit 1
              ;;
          esac
          REDCODE_VERSION="$VERSION" ./packages/redcode/script/publish.ts
      - name: Smoke the published package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          export npm_config_cache="$root/npm-cache"
          # npm read replicas can lag a successful publish by many minutes. Wait up to twenty
          # minutes overall: first until npm view serves the main package and every platform
          # package, then until the exact version installs.
          specs=("@reddb-io/redcode@${VERSION}")
          for manifest in packages/redcode/dist/*/package.json; do
            name="$(node -p 'require(process.argv[1]).name' "$PWD/$manifest")"
            if [ "$name" != "@reddb-io/redcode" ]; then specs+=("${name}@${VERSION}"); fi
          done
          if [ "${#specs[@]}" -lt 2 ]; then
            echo "::error::no platform package manifests found under packages/redcode/dist"
            exit 1
          fi
          missing_specs() {
            missing=()
            for spec in "${specs[@]}"; do
              if ! npm view "$spec" version >/dev/null 2>&1; then missing+=("$spec"); fi
            done
          }
          deadline=$((SECONDS + 1200))
          while true; do
            missing_specs
            if [ "${#missing[@]}" -eq 0 ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::npm registry still does not serve ${#missing[@]} of ${#specs[@]} packages: ${missing[*]}"
              exit 1
            fi
            echo "waiting for npm to serve ${#missing[@]} of ${#specs[@]} packages: ${missing[*]}"
            sleep 20
          done
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            if npm install --prefix "$root" --no-audit --no-fund "@reddb-io/redcode@${VERSION}"; then
              "$root/node_modules/.bin/redcode" --version | grep -Fx "$VERSION"
              REDCODE_RPC_URL=http://127.0.0.1:1/rpc "$root/node_modules/.bin/redcode-rpc-sidecar" </dev/null
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              missing_specs
              if [ "${#missing[@]}" -gt 0 ]; then
                echo "::error::@reddb-io/redcode@${VERSION} did not install; npm registry does not serve: ${missing[*]}"
              else
                echo "::error::@reddb-io/redcode@${VERSION} did not install although npm view serves all ${#specs[@]} packages"
              fi
              exit 1
            fi
            echo "registry smoke install attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
