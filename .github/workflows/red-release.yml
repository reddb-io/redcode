name: red-release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: red-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'reddb-io/redcode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # The version commit and the tag are pushed by the changesets action, and a push runs the
      # husky pre-push hook: a typecheck of every package, for a commit that only bumps versions.
      # It was killed for memory mid-run and took the release with it. Hooks are for developers;
      # this workflow's inputs were typechecked on the PR that produced them.
      HUSKY: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Configure git identity
        run: |
          git config user.name "redcode-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Maintain Version PR or tag release
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: bun run release:version
          publish: bun script/red-tag-release.ts
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
