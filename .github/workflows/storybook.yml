name: storybook

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storybook.yml"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/storybook.yml"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: storybook build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - id: release
        uses: ./.github/actions/release-only
        with:
          event: ${{ github.event_name }}
          head-ref: ${{ github.head_ref }}
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
          repository: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

      - name: Setup Bun
        if: steps.release.outputs.release_only != 'true'
        uses: ./.github/actions/setup-bun

      - name: Build Storybook
        if: steps.release.outputs.release_only != 'true'
        run: bun --cwd packages/storybook build
