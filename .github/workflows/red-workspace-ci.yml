name: red-workspace-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: release
        uses: ./.github/actions/release-only
        with:
          event: ${{ github.event_name }}
          head-ref: ${{ github.head_ref }}
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
          repository: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}
      - if: steps.release.outputs.release_only != 'true'
        uses: ./.github/actions/setup-bun
      - name: Check binary-only workflow posture
        if: steps.release.outputs.release_only != 'true'
        run: bun script/test-redcode-release-contract.ts
      - name: Build the current RPC sidecar
        if: steps.release.outputs.release_only != 'true'
        working-directory: packages/rpc-sidecar
        env:
          REDCODE_RPC_SIDECAR_OUTPUT: dist/release/redcode-rpc-sidecar-linux-x64
        run: bun run build
      # The verification build embeds a models catalog. Cache it per day so PR CI does not depend on
      # the catalog endpoints being reachable; restore-keys fall back to an earlier day's copy.
      - name: Date key for the models catalog cache
        if: steps.release.outputs.release_only != 'true'
        id: models-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore models catalog snapshot
        if: steps.release.outputs.release_only != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/models-api.json
          key: models-catalog-${{ steps.models-date.outputs.date }}
          restore-keys: models-catalog-
      - name: Fetch models catalog snapshot (best effort)
        if: steps.release.outputs.release_only != 'true'
        run: |
          file="$RUNNER_TEMP/models-api.json"
          if [ ! -s "$file" ] || [ "$(find "$file" -mmin +1440 2>/dev/null)" ]; then
            for url in https://models.opencode.ai/api.json https://models.dev/api.json; do
              if curl --fail --silent --show-error --location --max-time 60 --max-filesize 20971520 --output "$file.tmp" "$url"; then
                mv "$file.tmp" "$file"
                break
              fi
            done
          fi
          rm -f "$file.tmp"
      - name: Build the current native binary
        if: steps.release.outputs.release_only != 'true'
        env:
          REDCODE_RPC_SIDECAR_DIR: ${{ github.workspace }}/packages/rpc-sidecar/dist/release
          # Validated by the build; when missing or invalid the build fetches, and in this
          # verification-only build embeds an empty catalog with a warning. red-publish never sets it.
          MODELS_DEV_API_JSON: ${{ runner.temp }}/models-api.json
          REDCODE_MODELS_SNAPSHOT: optional
        run: REDCODE_VERSION="$(node -p "require('./package.json').version")" REDCODE_CHANNEL=latest REDCODE_RELEASE=1 ./packages/redcode/script/build.ts --single --skip-install --skip-embed-web-ui --skip-upload
      - name: Verify the native package contains the RPC sidecar
        if: steps.release.outputs.release_only != 'true'
        run: test -x packages/redcode/dist/redcode-linux-x64/bin/redcode-rpc-sidecar
      - name: Pack the npm distribution without publishing
        if: steps.release.outputs.release_only != 'true'
        run: REDCODE_VERSION="$(node -p "require('./package.json').version")" REDCODE_CHANNEL=latest ./packages/redcode/script/publish.ts --pack-only
      - name: Inspect packed package identity
        if: steps.release.outputs.release_only != 'true'
        run: |
          tarball="$(find packages/redcode/dist/redcode-package -maxdepth 1 -name 'reddb-io-redcode-*.tgz' -print -quit)"
          test -n "$tarball"
          tar -xOf "$tarball" package/package.json |
            node -e 'let text=""; process.stdin.on("data", (chunk) => text += chunk); process.stdin.on("end", () => { const pkg = JSON.parse(text); const expected = require("./package.json").version; if (pkg.name !== "@reddb-io/redcode" || pkg.version !== expected || pkg.bin.redcode === undefined || pkg.bin["redcode-rpc-sidecar"] === undefined) process.exit(1) })'
