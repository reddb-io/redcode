name: test

on:
  # Main runs too, so the caches it saves (Turbo, Playwright, Bun) are ones every pull request can
  # restore; a cache saved on a pull request is only visible to that pull request.
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev and main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

# Branch protection requires `unit (linux)`, `unit (windows)`, `e2e (linux)` and `e2e (windows)`.
# Each of those is an aggregator below, so the jobs that do the work can be sharded and reshaped
# without touching the protection rule.
jobs:
  changes:
    name: test scope
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.release.outputs.release_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: release
        uses: ./.github/actions/release-only
        with:
          event: ${{ github.event_name }}
          head-ref: ${{ github.head_ref }}
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
          repository: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  # Every package except @reddb-io/redcode, which runs in balanced shards of its own on both hosts.
  workspace-linux:
    name: workspace (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Normal runs finish well under 20 minutes; a stalled setup step must not hold the runner for hours.
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The pull request base must be reachable for the affected-package filter below.
          # A bare 0 is falsy in an expression and would fall through to 1, so both are strings.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      # Turbo 2 writes its local cache to `.turbo/cache`; caching any other path restores nothing
      # and every package re-runs its tests on every commit. Turbo hashes its own inputs, so the
      # newest saved cache is always the right one to start from; the key only has to be unique.
      - name: Restore Turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # A pull request tests the packages it changed and everything that depends on them. A change
      # outside packages/ (lockfile, patches, root or CI config) can reach any package, so it runs
      # every suite, as do pushes and manual runs.
      - name: Run unit tests
        timeout-minutes: 35
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=()
          # Captured first: `grep -q` closing the pipe early would fail `git diff` under pipefail.
          changed=$(git diff --name-only "$BASE...HEAD")
          if [ "$EVENT" = pull_request ] && ! grep -qv '^packages/' <<< "$changed"; then
            scope=("--filter=...[$BASE]")
            echo "Testing packages affected since $BASE"
          fi
          # Core, tui and server run their files across workers through `test:ci`; everything else
          # runs its plain `test` script. Sequential, so the two runs never build a dependency at once.
          status=0
          GITHUB_ACTIONS=false bun turbo test:ci --filter=!@reddb-io/redcode "${scope[@]}" --continue=dependencies-successful --log-order=stream || status=1
          GITHUB_ACTIONS=false bun turbo test --filter=!@reddb-io/redcode --filter=!@reddb-io/redcode-core --filter=!@reddb-io/redcode-tui --filter=!@reddb-io/redcode-server "${scope[@]}" --continue=dependencies-successful || status=1
          exit $status

      # Saved even when a suite fails: the packages that passed are the ones worth skipping next time.
      - name: Save Turbo cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Desktop has no package test script, so Turbo does not discover this focused suite.
      - name: Test desktop diagnostic retention
        working-directory: packages/desktop
        run: bun test src/main/log-retention.test.ts

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Build native RPC sidecar
        working-directory: packages/rpc-sidecar
        run: bun run test:native

  # The largest suite, split by recorded per-file durations (packages/redcode/test/timings.json)
  # so the three shards finish together. Every shard re-measures its own files and the
  # `redcode timings` job merges them into one `redcode-timings` artifact; when shards drift apart,
  # download it from a green run and commit it over packages/redcode/test/timings.json.
  redcode-linux:
    name: redcode (linux, ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test:ci --shard=${{ matrix.shard }}/3 --timings=test/timings.json --update-timings

      # Under --shard, --update-timings rewrites the file with only this shard's files.
      - name: Upload shard timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/redcode/test/timings.json
          if-no-files-found: ignore
          retention-days: 7

  redcode-timings:
    name: redcode timings
    needs: redcode-linux
    if: ${{ !cancelled() && needs.redcode-linux.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download shard timings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: redcode-timings-*-${{ github.run_attempt }}
          path: shards

      - name: Merge shard timings
        run: |
          jq -s '{version: 1, files: (map(.files) | add | to_entries | sort_by(-.value) | from_entries)}' shards/*/timings.json > timings.json
          jq -r '"\(.files | length) files, \(([.files[]] | add) / 1000 | floor)s serial"' timings.json

      - name: Upload merged timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redcode-timings
          path: timings.json
          retention-days: 30

  # Windows runs only the tests whose outcome the platform can change, listed per package in
  # test/windows.txt (paths, shells, processes, PTYs, file locking, git worktrees, LSP launch, CLI
  # process I/O). Linux runs every suite. Windows runners queue and set up several times slower than
  # Linux ones, so fewer Windows jobs is most of the wall-time win.
  windows:
    name: windows (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json; it covers
        # the core and TUI dependencies too.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Windows test subsets
        timeout-minutes: 35
        env:
          SHARD: ${{ matrix.shard }}/2
        run: |
          failed=()
          for pkg in core tui redcode; do
            mapfile -t paths < <(grep -vE '^[[:space:]]*(#|$)' "packages/$pkg/test/windows.txt")
            for path in "${paths[@]}"; do
              if [ ! -e "packages/$pkg/$path" ]; then
                echo "::error file=packages/$pkg/test/windows.txt::$path does not exist"
                failed+=("$pkg")
                continue 2
              fi
            done
            timings=()
            if [ -f "packages/$pkg/test/timings.json" ]; then timings=(--timings=test/timings.json); fi
            echo "::group::$pkg"
            if ! (cd "packages/$pkg" && GITHUB_ACTIONS=false bun run test:ci --shard="$SHARD" "${timings[@]}" "${paths[@]}"); then
              failed+=("$pkg")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Windows tests failed in: ${failed[*]}"
            exit 1
          fi

      # Desktop has no package test script, so it is not in the loop above.
      - name: Test desktop diagnostic retention
        if: matrix.shard == 1
        working-directory: packages/desktop
        run: bun test src/main/log-retention.test.ts

  # The HttpApi exerciser ran after the unit tests on the same runner and added four minutes to
  # the critical path; it only needs the workspace built.
  httpapi:
    name: httpapi (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Same ceiling as the other jobs that set Playwright up; a cold browser cache is setup time, not a stall.
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The design export scenarios render through Chromium. Without a browser in
      # PLAYWRIGHT_BROWSERS_PATH the renderer installs one inside the request, which blows past the
      # 30s scenario limit and fails v2.design.render, v2.design.jobs and v2.design.download.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run HttpApi exerciser gates
        working-directory: packages/redcode
        run: bun run test:httpapi

  unit-linux:
    name: unit (linux)
    runs-on: ubuntu-latest
    needs: [changes, workspace-linux, redcode-linux, httpapi]
    if: always()
    steps:
      - name: Every Linux suite passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          WORKSPACE_RESULT: ${{ needs.workspace-linux.result }}
          SHARD_RESULT: ${{ needs.redcode-linux.result }}
          HTTPAPI_RESULT: ${{ needs.httpapi.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$HTTPAPI_RESULT" = success

  unit-windows:
    name: unit (windows)
    runs-on: ubuntu-latest
    needs: [changes, windows]
    if: always()
    steps:
      - name: Every Windows suite passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$WINDOWS_RESULT" = success

  e2e-linux:
    name: e2e (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Typecheck app end-to-end tests
        working-directory: packages/app
        run: bun run typecheck:e2e

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Verify S1 and S2 on the production app
        if: ${{ !cancelled() }}
        working-directory: packages/app
        run: bun run test:e2e:local --config e2e/intelligence/playwright.config.ts --grep 'shows S1/S2|opens the new session page'
        env:
          CI: true
          PLAYWRIGHT_PORT: "4319"
        timeout-minutes: 10

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Windows runs the same suite in about three times the Linux wall time, so it is split in two.
  e2e-windows-shard:
    name: e2e (windows, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local --shard=${{ matrix.shard }}/2
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-windows:
    name: e2e (windows)
    runs-on: ubuntu-latest
    needs: [changes, e2e-windows-shard]
    if: always()
    steps:
      - name: Every Windows e2e shard passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          SHARD_RESULT: ${{ needs.e2e-windows-shard.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$SHARD_RESULT" = success
