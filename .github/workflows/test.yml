name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

# Branch protection requires `unit (linux)`, `unit (windows)`, `e2e (linux)` and `e2e (windows)`.
# Each of those is an aggregator below, so the jobs that do the work can be sharded and reshaped
# without touching the protection rule.
jobs:
  # Every package except @reddb-io/redcode, which runs in balanced shards of its own on both hosts.
  workspace-linux:
    name: workspace (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Normal runs finish well under 20 minutes; a stalled setup step must not hold the runner for hours.
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      # Turbo 2 writes its local cache to `.turbo/cache`; caching any other path restores nothing
      # and every package re-runs its tests on every commit.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun turbo test --filter=!@reddb-io/redcode

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Build native RPC sidecar
        working-directory: packages/rpc-sidecar
        run: bun run test:native

  workspace-windows:
    name: workspace (windows)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun turbo test --filter=!@reddb-io/redcode

  # The largest suite, split by recorded per-file durations (packages/redcode/test/timings.json)
  # so the three shards finish together. Refresh the file with
  # `bun test --timings=test/timings.json --update-timings` from packages/redcode when it drifts.
  redcode-linux:
    name: redcode (linux, ${{ matrix.shard }}/3)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test --shard=${{ matrix.shard }}/3 --timings=test/timings.json

  redcode-windows:
    name: redcode (windows, ${{ matrix.shard }}/3)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test --shard=${{ matrix.shard }}/3 --timings=test/timings.json

  # The HttpApi exerciser ran after the unit tests on the same runner and added four minutes to
  # the critical path; it only needs the workspace built.
  httpapi:
    name: httpapi (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run HttpApi exerciser gates
        working-directory: packages/redcode
        run: bun run test:httpapi

  unit-linux:
    name: unit (linux)
    runs-on: ubuntu-latest
    needs: [workspace-linux, redcode-linux, httpapi]
    if: always()
    steps:
      - name: Every Linux suite passed
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-linux.result }}
          SHARD_RESULT: ${{ needs.redcode-linux.result }}
          HTTPAPI_RESULT: ${{ needs.httpapi.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$HTTPAPI_RESULT" = success

  unit-windows:
    name: unit (windows)
    runs-on: ubuntu-latest
    needs: [workspace-windows, redcode-windows]
    if: always()
    steps:
      - name: Every Windows suite passed
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-windows.result }}
          SHARD_RESULT: ${{ needs.redcode-windows.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success

  e2e-linux:
    name: e2e (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Windows runs the same suite in about three times the Linux wall time, so it is split in two.
  e2e-windows-shard:
    name: e2e (windows, ${{ matrix.shard }}/2)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local --shard=${{ matrix.shard }}/2
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-windows:
    name: e2e (windows)
    runs-on: ubuntu-latest
    needs: e2e-windows-shard
    if: always()
    steps:
      - name: Every Windows e2e shard passed
        env:
          SHARD_RESULT: ${{ needs.e2e-windows-shard.result }}
        run: test "$SHARD_RESULT" = success
