name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

# Branch protection requires `unit (linux)`, `unit (windows)`, `e2e (linux)` and `e2e (windows)`.
# Each of those is an aggregator below, so the jobs that do the work can be sharded and reshaped
# without touching the protection rule.
jobs:
  changes:
    name: test scope
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.release.outputs.release_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: release
        uses: ./.github/actions/release-only
        with:
          event: ${{ github.event_name }}
          head-ref: ${{ github.head_ref }}
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
          repository: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  # Every package except @reddb-io/redcode, which runs in balanced shards of its own on both hosts.
  workspace-linux:
    name: workspace (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Normal runs finish well under 20 minutes; a stalled setup step must not hold the runner for hours.
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      # Turbo 2 writes its local cache to `.turbo/cache`; caching any other path restores nothing
      # and every package re-runs its tests on every commit.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun turbo test --filter=!@reddb-io/redcode --continue=dependencies-successful

      # Desktop has no package test script, so Turbo does not discover this focused suite.
      - name: Test desktop diagnostic retention
        working-directory: packages/desktop
        run: bun test src/main/log-retention.test.ts

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Build native RPC sidecar
        working-directory: packages/rpc-sidecar
        run: bun run test:native

  workspace-windows:
    name: workspace (windows)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun turbo test --filter=!@reddb-io/redcode --continue=dependencies-successful

      - name: Test desktop diagnostic retention
        working-directory: packages/desktop
        run: bun test src/main/log-retention.test.ts

  # The largest suite, split by recorded per-file durations (packages/redcode/test/timings.json)
  # so the three shards finish together. Refresh the file with
  # `bun test --timings=test/timings.json --update-timings` from packages/redcode when it drifts.
  redcode-linux:
    name: redcode (linux, ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test --shard=${{ matrix.shard }}/3 --timings=test/timings.json

  redcode-windows:
    name: redcode (windows, ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test --shard=${{ matrix.shard }}/3 --timings=test/timings.json

  # The HttpApi exerciser ran after the unit tests on the same runner and added four minutes to
  # the critical path; it only needs the workspace built.
  httpapi:
    name: httpapi (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Same ceiling as the other jobs that set Playwright up; a cold browser cache is setup time, not a stall.
    timeout-minutes: 45
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The design export scenarios render through Chromium. Without a browser in
      # PLAYWRIGHT_BROWSERS_PATH the renderer installs one inside the request, which blows past the
      # 30s scenario limit and fails v2.design.render, v2.design.jobs and v2.design.download.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run HttpApi exerciser gates
        working-directory: packages/redcode
        run: bun run test:httpapi

  unit-linux:
    name: unit (linux)
    runs-on: ubuntu-latest
    needs: [changes, workspace-linux, redcode-linux, httpapi]
    if: always()
    steps:
      - name: Every Linux suite passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          WORKSPACE_RESULT: ${{ needs.workspace-linux.result }}
          SHARD_RESULT: ${{ needs.redcode-linux.result }}
          HTTPAPI_RESULT: ${{ needs.httpapi.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$HTTPAPI_RESULT" = success

  unit-windows:
    name: unit (windows)
    runs-on: ubuntu-latest
    needs: [changes, workspace-windows, redcode-windows]
    if: always()
    steps:
      - name: Every Windows suite passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          WORKSPACE_RESULT: ${{ needs.workspace-windows.result }}
          SHARD_RESULT: ${{ needs.redcode-windows.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success

  e2e-linux:
    name: e2e (linux)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Typecheck app end-to-end tests
        working-directory: packages/app
        run: bun run typecheck:e2e

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Verify S1 and S2 on the production app
        if: ${{ !cancelled() }}
        working-directory: packages/app
        run: bun run test:e2e:local --config e2e/intelligence/playwright.config.ts --grep 'shows S1/S2|opens the new session page'
        env:
          CI: true
          PLAYWRIGHT_PORT: "4319"
        timeout-minutes: 10

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Windows runs the same suite in about three times the Linux wall time, so it is split in two.
  e2e-windows-shard:
    name: e2e (windows, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests
        run: bun --cwd packages/app run test:e2e:local --shard=${{ matrix.shard }}/2
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: packages/app/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-windows:
    name: e2e (windows)
    runs-on: ubuntu-latest
    needs: [changes, e2e-windows-shard]
    if: always()
    steps:
      - name: Every Windows e2e shard passed
        env:
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          SHARD_RESULT: ${{ needs.e2e-windows-shard.result }}
        run: |
          if [ "$RELEASE_ONLY" = true ]; then exit 0; fi
          test "$SHARD_RESULT" = success
