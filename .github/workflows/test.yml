name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  unit:
    name: ${{ matrix.settings.name == 'windows' && 'workspace (windows)' || 'unit (linux)' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: blacksmith-4vcpu-ubuntu-2404
          - name: windows
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        # The largest Windows suite runs in isolated shards below. Every other package stays here.
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun turbo test ${{ runner.os == 'Windows' && '--filter=!@reddb-io/redcode' || '' }}
        env:
          REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Build native RPC sidecar
        if: runner.os == 'Linux'
        working-directory: packages/rpc-sidecar
        run: bun run test:native

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/redcode
        run: bun run test:httpapi

  redcode-windows:
    name: redcode (windows, ${{ matrix.shard }}/3)
    runs-on: blacksmith-4vcpu-windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDCODE_WHITEBOARD_DIR: ${{ github.workspace }}/packages/redcode/dist/whiteboard
      REDCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build whiteboard test assets
        working-directory: packages/redcode
        run: bun run build:whiteboard

      - name: Configure git identity
        run: |
          git config --global user.email "bot@reddb.io"
          git config --global user.name "redcode"

      - name: Build test dependencies
        # Preserve the same ^build prerequisites as @reddb-io/redcode#test in turbo.json.
        run: bun turbo build '--filter=@reddb-io/redcode^...'

      - name: Run Redcode test shard
        working-directory: packages/redcode
        timeout-minutes: 35
        run: GITHUB_ACTIONS=false bun run test --shard=${{ matrix.shard }}/3 --timings="$RUNNER_TEMP/redcode-test-timings.json" --update-timings

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redcode-windows-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/redcode-test-timings.json
          if-no-files-found: warn
          retention-days: 7

  unit-windows:
    name: unit (windows)
    runs-on: ubuntu-latest
    needs: [unit, redcode-windows]
    if: always()
    steps:
      - name: Every Windows suite passed
        env:
          WORKSPACE_RESULT: ${{ needs.unit.result }}
          SHARD_RESULT: ${{ needs.redcode-windows.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$SHARD_RESULT" = success

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: blacksmith-4vcpu-ubuntu-2404
          - name: windows
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
