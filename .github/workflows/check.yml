name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/check-workflows

      - name: Verify independent Redcode release metadata
        env:
          REDCODE_BUILD: "1"
          REDCODE_CHANNEL: latest
          REDCODE_RELEASE: "1"
        run: |
          export REDCODE_VERSION=$(bun -p 'require("./packages/redcode/package.json").version')
          bun -e '
            const { Script } = await import("./packages/script/src/index.ts")
            if (Script.version !== process.env.REDCODE_VERSION || Script.channel !== "latest" || !Script.release)
              throw new Error("Redcode release metadata does not match its own manifest")
          '

      - name: Validate Changesets
        id: changesets
        run: |
          bun run release:status --output /tmp/redcode-release-plan.json
          echo "pending=$(bun -p 'require("/tmp/redcode-release-plan.json").releases.length > 0')" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: bun run check

      - name: Rehearse Changesets version and changelog generation
        if: steps.changesets.outputs.pending == 'true'
        run: |
          bun run release:version
          bun install --lockfile-only --ignore-scripts
