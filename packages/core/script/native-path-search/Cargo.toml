[package]
name = "redcode-path-search-poc"
version = "0.1.0"
edition = "2021"
publish = false

[features]
ranking-basename-experiment = []
typo-experiment = ["ranking-basename-experiment"]
typo-always-experiment = ["typo-experiment"]
typo-mask-experiment = ["typo-always-experiment"]
typo-single-pass-experiment = ["typo-mask-experiment"]
typo-path-filter-experiment = ["typo-single-pass-experiment"]
typo-signature-cache-experiment = ["typo-path-filter-experiment"]
typo-score-shortcut-experiment = ["typo-signature-cache-experiment"]
neo-frizbee-experiment = ["dep:neo_frizbee"]
neo-parallel-experiment = ["neo-frizbee-experiment"]
neo-pool-experiment = ["neo-frizbee-experiment", "dep:rayon"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nucleo-matcher = "=0.3.1"
neo_frizbee = { version = "=0.11.0", optional = true, features = ["match_end_col"] }
rayon = { version = "=1.12.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["napi"]
default-members = ["."]
